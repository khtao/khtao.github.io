<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khtao · Blog</title>
<meta name="description" content="一个用文字对抗遗忘的地方。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234a5bd6'/%3E%3Ctext x='50' y='68' font-size='56' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#ffffff; --bg-soft:#f6f7f9; --hover-bg:#f4f5f8;
  --fg:#16181d; --fg-mid:#4c5158; --fg-soft:#6f747e;
  --line:#e9eaee; --line-soft:#f1f2f5;
  --accent:#4a5bd6; --accent-soft:rgba(74,91,214,.09);
  --card:#ffffff; --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --code-bg:#f7f8fa;
  --radius:14px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme="dark"]{
  --bg:#0e1117; --bg-soft:#151a22; --hover-bg:#181d26;
  --fg:#e7e9ee; --fg-mid:#b0b6c0; --fg-soft:#7c838f;
  --line:#232935; --line-soft:#1c222c;
  --accent:#93a5ff; --accent-soft:rgba(147,165,255,.14);
  --card:#131822; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  --code-bg:#0d1117;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px; line-height:1.7; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .28s ease,color .28s ease;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;}

/* ============ 顶部 ============ */
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;background:transparent;}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear;}
.site-header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.nav{max-width:1120px;margin:0 auto;padding:0 24px;height:62px;display:flex;align-items:center;gap:18px;}
.brand{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;}
.brand small{font-weight:500;color:var(--fg-soft);margin-left:8px;font-size:13px;letter-spacing:0;}
.nav-spacer{flex:1;}
.search{position:relative;flex:0 1 260px;}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;width:15px;height:15px;}
.search input{
  width:100%;height:38px;padding:0 34px 0 34px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg-soft);color:var(--fg);
  font-size:14px;font-family:inherit;transition:.2s;
}
.search input:focus{outline:none;border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft);}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;
  width:22px;height:22px;border-radius:50%;color:var(--fg-soft);font-size:15px;line-height:1;display:grid;place-items:center;}
.search.has .clear{opacity:1;pointer-events:auto;}
.search .clear:hover{background:var(--hover-bg);}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--fg-mid);transition:.18s;flex:none;
}
.icon-btn:hover{background:var(--hover-bg);color:var(--fg);}
.icon-btn svg{width:18px;height:18px;}
[data-theme="dark"] .i-moon{display:none;}
.i-sun{display:none;}
[data-theme="dark"] .i-sun{display:block;}

/* ============ 布局 ============ */
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
main{min-height:60vh;}

/* Hero */
.hero{padding:78px 0 44px;}
.hero h1{
  margin:0;font-size:clamp(34px,5.2vw,54px);line-height:1.12;font-weight:800;letter-spacing:-.035em;
  background:linear-gradient(92deg,var(--fg) 20%,var(--accent));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero p{margin:16px 0 0;font-size:17px;color:var(--fg-soft);max-width:620px;}
.hero-meta{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--fg-soft);}
.dot{width:3px;height:3px;border-radius:50%;background:var(--fg-soft);opacity:.6;}

/* 标签栏 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0 26px;}
.chip{
  padding:6px 13px;border-radius:999px;font-size:13px;color:var(--fg-mid);
  border:1px solid var(--line);background:var(--bg);transition:.16s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
[data-theme="dark"] .chip.on{color:#0e1117;}
.chip .n{opacity:.55;margin-left:5px;font-size:12px;}

/* 文章列表 */
.list-title{font-size:13px;color:var(--fg-soft);margin:0 0 6px;letter-spacing:.04em;}
.post-item{
  display:grid;grid-template-columns:104px 1fr;gap:22px;align-items:baseline;
  padding:24px 22px;margin:0 -22px;border-radius:var(--radius);
  border-bottom:1px solid var(--line-soft);transition:background .18s;
}
.post-item:last-child{border-bottom:none;}
.post-item:hover{background:var(--hover-bg);border-bottom-color:transparent;}
.post-date{font-family:var(--mono);font-size:12.5px;color:var(--fg-soft);letter-spacing:.02em;padding-top:5px;}
.post-title{margin:0;font-size:20px;font-weight:650;letter-spacing:-.015em;line-height:1.45;transition:color .16s;}
.post-item:hover .post-title{color:var(--accent);}
.post-sum{margin:8px 0 0;font-size:14.5px;color:var(--fg-soft);line-height:1.72;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.post-tags{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.tag-mini{font-size:12px;color:var(--fg-soft);background:var(--bg-soft);padding:3px 9px;border-radius:6px;}
mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px;}

.post-date em{display:block;font-style:normal;font-size:11px;opacity:.72;margin-top:2px;white-space:nowrap;}
.banner.soft{background:var(--bg-soft);border-style:dashed;}
.banner.err{background:rgba(217,74,74,.09);border-color:rgba(217,74,74,.3);color:var(--fg-mid);}
.banner button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg-mid);}
.banner button.ghost:hover{border-color:var(--accent);color:var(--accent);}

/* 骨架/空/错误 */
.skel{padding:24px 0;border-bottom:1px solid var(--line-soft);}
.skel i{display:block;height:13px;border-radius:6px;background:var(--bg-soft);
  background:linear-gradient(90deg,var(--bg-soft) 25%,var(--hover-bg) 37%,var(--bg-soft) 63%);
  background-size:400% 100%;animation:sh 1.4s ease infinite;}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{padding:70px 0;text-align:center;color:var(--fg-soft);}
.empty .big{font-size:34px;opacity:.35;margin-bottom:12px;}
.banner{
  margin:20px 0;padding:14px 16px;border-radius:12px;font-size:14px;
  background:var(--accent-soft);color:var(--fg-mid);border:1px solid var(--line);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.banner button{padding:6px 12px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;}
[data-theme="dark"] .banner button{color:#0e1117;}

/* ============ 文章页 ============ */
.post-layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:56px;max-width:1120px;margin:0 auto;padding:52px 24px 80px;align-items:start;}
.post-main{min-width:0;max-width:742px;}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg-soft);transition:.16s;margin-bottom:26px;}
.back:hover{color:var(--accent);}
.post-head h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.28;font-weight:800;letter-spacing:-.03em;}
.post-meta{margin:16px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13.5px;color:var(--fg-soft);}
.post-cover{margin:28px 0 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
.post-cover img{display:block;width:100%;}
.post-divider{height:1px;background:var(--line);margin:32px 0 6px;}

/* Markdown 正文 */
.md{font-size:16.5px;line-height:1.86;color:var(--fg);word-wrap:break-word;}
.md>*:first-child{margin-top:8px;}
.md h1,.md h2,.md h3,.md h4{letter-spacing:-.02em;line-height:1.4;font-weight:700;scroll-margin-top:84px;}
.md h1{font-size:28px;margin:2em 0 .8em;}
.md h2{font-size:23px;margin:2.2em 0 .8em;padding-bottom:.3em;border-bottom:1px solid var(--line-soft);}
.md h3{font-size:19px;margin:1.9em 0 .7em;}
.md h4{font-size:16.5px;margin:1.6em 0 .6em;}
.md p{margin:1.05em 0;}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);}
.md a:hover{border-bottom-color:var(--accent);}
.md strong{font-weight:680;}
.md ul,.md ol{margin:1.05em 0;padding-left:1.5em;}
.md li{margin:.42em 0;}
.md li::marker{color:var(--fg-soft);}
.md blockquote{
  margin:1.6em 0;padding:.2em 0 .2em 18px;border-left:3px solid var(--accent);
  color:var(--fg-mid);background:linear-gradient(90deg,var(--accent-soft),transparent);
  border-radius:0 8px 8px 0;
}
.md blockquote p{margin:.5em 0;}
.md hr{margin:2.6em 0;border:none;height:1px;background:var(--line);}
.md img{max-width:100%;border-radius:12px;margin:1.6em 0;display:block;cursor:zoom-in;border:1px solid var(--line-soft);}
.md table{border-collapse:collapse;width:100%;margin:1.6em 0;font-size:15px;display:block;overflow-x:auto;}
.md th,.md td{border:1px solid var(--line);padding:9px 14px;text-align:left;}
.md th{background:var(--bg-soft);font-weight:650;}
.md code{
  font-family:var(--mono);font-size:.88em;background:var(--bg-soft);
  padding:.16em .4em;border-radius:6px;border:1px solid var(--line-soft);
}
.md pre{
  position:relative;background:var(--code-bg);border:1px solid var(--line-soft);
  border-radius:12px;padding:16px 18px;overflow-x:auto;margin:1.6em 0;line-height:1.68;
}
.md pre code{background:none;border:none;padding:0;font-size:13.5px;line-height:1.68;}
.md .copy{
  position:absolute;top:9px;right:9px;font-size:12px;padding:4px 9px;border-radius:7px;
  background:var(--bg);border:1px solid var(--line);color:var(--fg-soft);opacity:0;transition:.16s;
}
.md pre:hover .copy{opacity:1;}
.md .copy:hover{color:var(--accent);border-color:var(--accent);}
.md .copy.done{color:#12a150;border-color:#12a150;}

/* 代码高亮配色 */
.hljs-comment,.hljs-quote{color:#9aa0ab;font-style:italic;}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-doctag,.hljs-formula{color:#a626a4;}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute,.hljs-meta .hljs-string{color:#50a14f;}
.hljs-number,.hljs-variable,.hljs-template-variable,.hljs-type,.hljs-selector-class,.hljs-selector-attr,.hljs-selector-pseudo{color:#b76b01;}
.hljs-title,.hljs-section,.hljs-title.class_,.hljs-title.function_{color:#4078f2;}
.hljs-attr,.hljs-params,.hljs-symbol,.hljs-bullet,.hljs-link{color:#c18401;}
.hljs-built_in,.hljs-name,.hljs-tag{color:#e45649;}
.hljs-deletion{color:#f07178;}
.hljs-emphasis{font-style:italic;}
.hljs-strong{font-weight:700;}
[data-theme="dark"] .hljs-comment,.hljs-quote{color:#5c6370;}
[data-theme="dark"] .hljs-keyword,.hljs-selector-tag,[data-theme="dark"] .hljs-literal{color:#c678dd;}
[data-theme="dark"] .hljs-string,[data-theme="dark"] .hljs-regexp,[data-theme="dark"] .hljs-addition,[data-theme="dark"] .hljs-attribute{color:#98c379;}
[data-theme="dark"] .hljs-number,[data-theme="dark"] .hljs-type,[data-theme="dark"] .hljs-selector-class{color:#d19a66;}
[data-theme="dark"] .hljs-title,[data-theme="dark"] .hljs-title.class_,[data-theme="dark"] .hljs-title.function_{color:#61afef;}
[data-theme="dark"] .hljs-attr,[data-theme="dark"] .hljs-params,[data-theme="dark"] .hljs-symbol{color:#e5c07b;}
[data-theme="dark"] .hljs-built_in,[data-theme="dark"] .hljs-name,[data-theme="dark"] .hljs-tag{color:#e06c75;}

/* ============ 原始 HTML 文章：iframe 原样渲染 ============ */
.post-layout.raw{grid-template-columns:minmax(0,1fr);gap:0;max-width:1340px;padding:14px 24px 30px;}
.post-layout.raw .post-main{max-width:none;}
.raw-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0 12px;}
.raw-head .sp{flex:1;}
.raw-head .lb{font-size:11px;letter-spacing:1.4px;font-weight:700;color:var(--fg-soft);
  background:var(--bg-soft);border:1px solid var(--line);padding:3px 9px;border-radius:99px;}
.btn-s{padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg-mid);font-size:12.5px;font-weight:600;transition:.16s;white-space:nowrap;}
.btn-s:hover{border-color:var(--accent);color:var(--accent);}
.btn-s.on{background:var(--accent);border-color:var(--accent);color:#fff;}
[data-theme="dark"] .btn-s.on{color:#0e1117;}
.raw-title{padding:4px 2px 12px;}
.raw-title h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.028em;line-height:1.3;margin:0;}
.raw-title .post-meta{margin:10px 0 0;}
.raw-frame{display:block;width:100%;border:0;background:#fff;border-radius:12px;
  border:1px solid var(--line-soft);box-shadow:var(--shadow);}
.raw-tip{font-size:12px;color:var(--fg-soft);padding:10px 2px 0;}
/* 原样模式：外层不再产生滚动，滚动全部交给文章自己 */
html.raw-mode,html.raw-mode body{overflow:hidden;height:100%}
html.raw-mode footer{display:none;}
html.raw-mode #totop{display:none;}
html.raw-mode .post-layout.raw{padding-bottom:0;}
html.raw-mode main{overflow:hidden;}

/* TOC */
.toc{position:sticky;top:88px;font-size:13.5px;max-height:calc(100vh - 130px);overflow-y:auto;}
.toc .t{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft);margin-bottom:12px;}
.toc a{
  display:block;padding:5px 0 5px 14px;color:var(--fg-soft);line-height:1.5;
  border-left:2px solid var(--line);transition:.15s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.toc a:hover{color:var(--fg);}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600;}
.toc a.lv3{padding-left:26px;font-size:12.5px;}
.toc::-webkit-scrollbar{width:3px;}
.toc::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

/* 文章底部 */
.post-foot{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--fg-soft);}
.post-foot a:hover{color:var(--accent);}

/* 页脚 */
footer{border-top:1px solid var(--line);margin-top:40px;}
.foot{max-width:1120px;margin:0 auto;padding:28px 24px 40px;color:var(--fg-soft);font-size:13px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

/* 悬浮按钮 */
.float{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;flex-direction:column;gap:10px;}
.float button{
  width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg-mid);transition:.18s;opacity:0;pointer-events:none;
}
.float button.show{opacity:1;pointer-events:auto;}
.float button:hover{color:var(--accent);transform:translateY(-2px);}
.float svg{width:17px;height:17px;}

/* 灯箱 */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(12,14,18,.92);display:none;place-items:center;padding:30px;cursor:zoom-out;}
.lightbox.on{display:grid;}
.lightbox img{max-width:100%;max-height:94vh;border-radius:8px;}

/* 响应式 */
@media (max-width:1080px){
  .post-layout{grid-template-columns:1fr;gap:0;}
  .toc{display:none;}
}
@media (max-width:640px){
  .nav{padding:0 16px;gap:10px;}
  .brand small{display:none;}
  .search{flex:1 1 auto;max-width:none;}
  .hero{padding:48px 0 30px;}
  .wrap,.post-layout{padding-left:16px;padding-right:16px;}
  .post-item{grid-template-columns:1fr;gap:6px;padding:20px 14px;margin:0 -14px;}
  .post-date{padding-top:0;}
  .post-title{font-size:18.5px;}
  .toc{display:none;}
}

/* ============ v3 · editorial refinement ============ */
:root{
  --bg:#fcfcfe; --bg-soft:#f3f4f9; --hover-bg:#f4f5fb;
  --fg:#202335; --fg-mid:#485064; --fg-soft:#788195;
  --line:#e6e8f0; --line-soft:#eceef4;
  --accent:#5b5bd6; --accent-soft:rgba(91,91,214,.085);
  --card:#ffffff; --radius:18px;
}
[data-theme="dark"]{
  --bg:#0f121b; --bg-soft:#171c29; --hover-bg:#1b2130;
  --fg:#eceefa; --fg-mid:#bbc0d1; --fg-soft:#858da3;
  --line:#293043; --line-soft:#21283a;
  --accent:#a6adff; --accent-soft:rgba(166,173,255,.12);
  --card:#171c29;
}
body{letter-spacing:.004em;}
.site-header{background:color-mix(in srgb,var(--bg) 88%,transparent);}
.nav{height:68px;}
.brand{display:inline-flex;align-items:center;gap:8px;letter-spacing:-.035em;font-size:17px;}
.brand-icon{color:var(--accent);font-size:22px;line-height:1;}
.brand small{padding-left:8px;border-left:1px solid var(--line);margin-left:5px;letter-spacing:.03em;}
.wrap{max-width:1016px;}
.hero{position:relative;padding:98px 0 64px;overflow:hidden;}
.hero::after{content:"";position:absolute;top:30px;right:3%;width:210px;height:210px;
 background:radial-gradient(circle,var(--accent-soft),transparent 72%);pointer-events:none;opacity:.65;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;font-weight:650;color:var(--accent);
 display:flex;align-items:center;gap:9px;margin:0 0 20px;}
.eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft);}
.hero h1{background:none;-webkit-text-fill-color:var(--fg);color:var(--fg);max-width:900px;
 font-size:clamp(37px,5.2vw,58px);letter-spacing:-.052em;line-height:1.24;}
.hero-star{display:inline-block;font-family:serif;font-size:.42em;vertical-align:top;margin:0 0 0 13px;color:var(--accent);
 -webkit-text-fill-color:var(--accent);}
.hero p{font-size:16px;line-height:1.9;margin-top:21px;}
.hero-bottom{margin-top:36px;display:flex;align-items:center;gap:12px;color:var(--fg-soft);font-size:12.5px;}
.hero-rule{width:34px;height:1px;background:var(--accent);opacity:.6;}
.toolbar{padding:0 0 31px;gap:9px;}
.chip{padding:7px 14px;background:var(--bg);border:1px solid var(--line);}
.chip.on{box-shadow:0 3px 10px var(--accent-soft);}
.list-title{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;margin:0 0 7px;}
.post-item{grid-template-columns:108px minmax(0,1fr);gap:30px;padding:30px 20px;
 margin:0 -20px;border-bottom:1px solid var(--line);border-radius:14px;transition:background .22s ease,transform .22s ease;}
.post-item:hover{background:var(--hover-bg);transform:translateX(3px);}
.post-date{font-size:12px;letter-spacing:-.005em;padding-top:4px;}
.post-date em{margin-top:5px;line-height:1.5;}
.post-title{font-size:21px;line-height:1.48;font-weight:730;letter-spacing:-.029em;}
.post-sum{font-size:14px;line-height:1.84;margin-top:10px;color:var(--fg-soft);max-width:720px;}

<script>
/* =======================================================================
   静态索引博客 · v3
   - 文章清单和提交日期来自同域 blog/index.json（Actions 自动生成）
   - 浏览器不再请求 GitHub API / 第三方镜像 / Personal Access Token
   - 对零文章、删除、离线缓存做独立处理
   ======================================================================= */

const DEFAULT_CFG = {
  title:"Khtao", subtitle:"记录技术、产品与生活", description:"一个用文字对抗遗忘的地方。",
  author:"khtao", owner:"khtao", repo:"khtao.github.io", branch:"main",
  blogDir:"blog", pageSize:50, footer:"© 2026 khtao · Built with GitHub Pages"
};
let cfg = Object.assign({}, DEFAULT_CFG);
const CACHE_KEY = "khtao_blog_cache_v3";
const state = {
  posts:[], q:"", tag:"", loading:true, error:"", offline:false,
  syncedAt:0, generated:"", hasList:false, refreshing:false
};
let syncSequence = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isPost = n => /\.(md|markdown|html?)$/i.test(n) && !String(n).startsWith("_") && !String(n).startsWith(".");
const safeStore = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
async function getLocalText(url, timeout=10000){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  try{
    const r = await fetch(url, {signal:ctl.signal, cache:"no-store"});
    if(!r.ok) throw new Error("HTTP_"+r.status);
    return await r.text();
  } finally { clearTimeout(timer); }
}
async function pool(items, limit, fn){
  let next = 0;
  await Promise.all(Array.from({length:Math.min(limit, items.length)}, async () => {
    while(next < items.length){
      const n = next++;
      try{ await fn(items[n],n); }catch(e){ console.warn("文章载入失败",e); }
    }
  }));
}
async function loadConfig(){
  try{
    const c = JSON.parse(await getLocalText("./config.json?v=" + Date.now(),6000));
    cfg = Object.assign({},DEFAULT_CFG,c||{});
  }catch(e){ cfg = Object.assign({},DEFAULT_CFG); }
  document.title = cfg.title + " · Blog";
  const md = document.querySelector('meta[name=description]');
  if(md) md.content = cfg.description;
  const b = $(".brand");
  if(b) b.innerHTML = `<span class="brand-icon" aria-hidden="true">✦</span>${esc(cfg.title)}<small>Notes</small>`;
  $("#footText").textContent = cfg.footer;
  const gh = $("#footGithub");
  if(gh) gh.href = `https://github.com/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;
}
function localRepoUrl(path){
  const encoded = String(path).split("/").map(encodeURIComponent).join("/");
  return "./" + encoded;
}
async function fetchList(){
  // 浏览器和 CDN 可缓存旧版 index.json；查询戳和 no-store 减少删除文章后的残留。
  const url = localRepoUrl(cfg.blogDir.replace(/^\/+|\/+$/g, "") + "/index.json") + "?v=" + Date.now();
  const j = JSON.parse(await getLocalText(url,10000));
  // [] 表示用户删除了全部文章：必须视为成功，而不是切换到远程 GitHub API。
  if(!j || !Array.isArray(j.files)) throw new Error("INVALID_INDEX");
  const prefix = cfg.blogDir.replace(/^\/+|\/+$/g, "") + "/";
  const files = j.files.filter(f => f && typeof f.name === "string" && isPost(f.name)
    && !f.name.includes("/") && !f.name.includes("\\")
    && (!f.path || f.path === prefix + f.name))
    .map(f => ({name:f.name, path:prefix+f.name, sha:String(f.sha||""), meta:f}));
  return {files, generated:String(j.generated||"")};
}

/* ---------- 相对路径解析：以 blog/ 为根目录 ---------- */
function relToRepoPath(rel){
  rel = String(rel).trim().split(/[?#]/)[0];
  if(!rel || /^(https?:)?\/\//i.test(rel) || /^(data|blob|mailto|tel|javascript|file):/i.test(rel)) return null;
  const base = String(cfg.blogDir || "blog").replace(/^\/+|\/+$/g, "");
  const parts = ((base ? base + "/" : "") + rel).split("/");
  const st = [];
  for(const seg of parts){
    if(seg === "" || seg === ".") continue;
    if(seg === ".."){ if(st.length > 1) st.pop(); }
    else st.push(seg);
  }
  const clean = st.join("/");
  return (!clean || clean === base) ? null : clean;
}
function assetURLs(repoPath){
  return [localRepoUrl(repoPath)];
}

/* 把整篇 HTML 文档里的相对路径资源改写成仓库绝对地址，并收集备用镜像 */
function rewriteDocAssets(html){
  const alt = {};
  const doc = new DOMParser().parseFromString(String(html), "text/html");
  const mapUrl = v => {
    v = String(v == null ? "" : v).trim();
    if(!v) return v;
    const rp = relToRepoPath(v);
    if(!rp) return v;
    const urls = assetURLs(rp);
    alt[urls[0]] = urls;
    return urls[0];
  };
  const fixAttr = (el, attr) => {
    if(!el.hasAttribute(attr)) return;
    const v = el.getAttribute(attr);
    if(!v || !v.trim()) return;
    const nv = mapUrl(v);
    if(nv !== v.trim()) el.setAttribute(attr, nv);
  };
  doc.querySelectorAll("[src],[href],[poster],[data-src]").forEach(el => {
    ["src","href","poster","data-src"].forEach(a => fixAttr(el, a));
  });
  const fixCss = css => String(css).replace(/url\(\s*(['"]?)([^)'"]+)\1\s*\)/g, (m, q, u) => {
    const nv = mapUrl(u.trim());
    return nv === u.trim() ? m : "url(" + q + nv + q + ")";
  });
  doc.querySelectorAll("[style]").forEach(el => el.setAttribute("style", fixCss(el.getAttribute("style"))));
  doc.querySelectorAll("style").forEach(s2 => { s2.textContent = fixCss(s2.textContent); });
  // 外链在新标签打开，避免把 iframe 导航走
  doc.querySelectorAll('a[href^="http"]').forEach(a => { a.setAttribute("target","_blank"); a.setAttribute("rel","noopener"); });
  doc.querySelectorAll("img").forEach(img => { if(!img.hasAttribute("loading")) img.setAttribute("loading","lazy"); });
  return {html:"<!DOCTYPE html>\n" + doc.documentElement.outerHTML, alt};
}

/* 组装一篇原始 HTML 文章要塞进 iframe 的完整文档 */
function buildRawDoc(p){
  const raw = p.rawHtml || p.body || "";
  const isFull = /<!doctype\s+html/i.test(raw) || /<html[\s>]/i.test(raw);
  let doc = raw;
  if(!isFull){
    const links = (p.cssLinks || []).map(h => {
      const rp = relToRepoPath(h);
      return '<link rel="stylesheet" href="' + (rp ? assetURLs(rp)[0] : h) + '">';
    });
    doc = '<!DOCTYPE html>\n<html lang="zh-CN"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>html,body{margin:0;padding:0}body{padding:14px 16px;font-size:16px;line-height:1.75;color:#16181d;' +
      'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}img{max-width:100%}</style>' +
      (p.styles || []).map(c => "<style>" + c + "</style>").join("") + links.join("") +
      "</head><body>" + p.body + "</body></html>";
  }
  return rewriteDocAssets(doc);
}

/* 注入 iframe 内部的小助手：图片源回退 / 锚点跳转 / 高度上报 */
function rawFrameHelper(alt){
  return "\n<script>(function(){" +
    "var ALT=" + JSON.stringify(alt || {}) + ";\n" +
    "document.querySelectorAll('img').forEach(function(im){im.setAttribute('data-raw',im.getAttribute('src')||'');});\n" +
    "document.addEventListener('error',function(e){var t=e.target;if(!t||t.tagName!=='IMG')return;" +
      "var key=t.getAttribute('data-raw');var list=ALT[key]||[key];var i=(parseInt(t.getAttribute('data-i')||'0',10)||0)+1;" +
      "if(i<list.length){t.setAttribute('data-i',i);t.src=list[i];}},true);\n" +
    "document.addEventListener('click',function(e){var el=e.target;var a=el&&el.closest?el.closest('a[href^=\"#\"]'):null;if(!a)return;" +
      "var h=a.getAttribute('href')||'';if(h.length<2)return;e.preventDefault();" +
      "var id=decodeURIComponent(h.slice(1));var t=document.getElementById(id)||document.getElementsByName(id)[0];if(!t)return;" +
      "var y=t.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)-72;" +
      "try{parent.postMessage({__bf:'scroll',y:y},'*');}catch(err){}} ,true);\n" +
    "function H(){return Math.max(document.documentElement.scrollHeight||0,(document.body&&document.body.scrollHeight)||0);}" +
    "var last=0;function send(){var h=Math.ceil(H());if(h&&Math.abs(h-last)>2){last=h;try{parent.postMessage({__bf:'h',h:h},'*');}catch(err){}}}" +
    "if(window.ResizeObserver){try{new ResizeObserver(send).observe(document.documentElement);}catch(err){}}" +
    "if(window.MutationObserver){try{new MutationObserver(send).observe(document.documentElement,{childList:true,subtree:true});}catch(err){}}" +
    "document.addEventListener('DOMContentLoaded',send);window.addEventListener('load',send);" +
    "[60,200,500,1200,2500,4500].forEach(function(t){setTimeout(send,t);});setInterval(send,1200);" +
  "})();<\/script>\n";
}
/* 在 </body> 前插入助手脚本 */
function injectHelper(doc, alt){
  const helper = rawFrameHelper(alt);
  if(/<\/body>/i.test(doc)) return doc.replace(/<\/body>/i, helper + "</body>");
  return doc + helper;
}

/* ---------- 元信息解析 ---------- */
function parseFrontMatter(raw){
  const fm = {};
  const m = raw.match(/^\uFEFF?\s*---\r?\n([\s\S]*?)\r?\n---(?:\s*(?:\r?\n|$))/);
  if(!m) return {fm, body:raw};
  let listTags = false;
  m[1].split(/\r?\n/).forEach(line => {
    if(listTags && /^\s*-\s+\S/.test(line)){
      fm.tags.push(line.replace(/^\s*-\s+/, "").trim().replace(/^['\"]|['\"]$/g, ""));
      return;
    }
    listTags = false;
    const match = line.match(/^([\w-]+)\s*:\s*(.*)$/);
    if(!match) return;
    const k = match[1].trim().toLowerCase();
    let v = match[2].trim().replace(/^['\"]|['\"]$/g, "");
    if(["tags", "tag", "categories", "category"].includes(k)){
      if(!v){ fm.tags = []; listTags = true; }
      else fm.tags = v.replace(/^\[|\]$/g, "").split(/[,，、]/).map(s => s.trim().replace(/^['\"]|['\"]$/g, "")).filter(Boolean);
    } else fm[k] = v;
  });
  return {fm, body: raw.slice(m[0].length)};
}
function stripMarkup(s){
  return String(s)
    .replace(/```[\s\S]*?```/g," ")
    .replace(/`[^`]*`/g," ")
    .replace(/!\[[^\]]*\]\([^)]*\)/g," ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g,"$1")
    .replace(/<[^>]+>/g," ")
    .replace(/^[\s>#\-*|]+/gm," ")
    .replace(/\s+/g," ").trim();
}
/* 文件名 → 可读标题：去掉日期前缀、序号，连字符转空格 */
function prettyName(base){
  let s = String(base).replace(/\.(md|markdown|html?)$/i, "");
  s = s.replace(/^\s*\d{4}[-_.]?\d{2}[-_.]?\d{2}\s*[-_.\s]*/, "");   // 2026-10-26-
  s = s.replace(/^\s*\d{2,4}[-_.]?\d{2}[-_.]?\d{2}\s*[-_.\s]*/, "");
  s = s.replace(/[_.\-]+/g, " ").replace(/\s+/g, " ").trim();
  if(!s) s = String(base).replace(/\.(md|markdown|html?)$/i, "");
  return s.replace(/\b\w/g, c => c.toUpperCase() === c ? c : c);
}
/* 文件名里提取日期：2026-10-26-title.md / 20261026-title.md */
function dateFromName(name){
  const s = String(name);
  let m = s.match(/(?:^|[^\d])(\d{4})[-_.]?(\d{2})[-_.]?(\d{2})(?:[^\d]|$)/);
  if(m) return m[1] + "-" + m[2] + "-" + m[3];
  return "";
}
/* HTML 里抽取 meta / h1 / 首个段落 */
function htmlPick(raw){
  const get = re => { const m = raw.match(re); return m ? stripMarkup(m[1]) : ""; };
  const title =
    get(/<meta[^>]+(?:property|name)=["']og:title["'][^>]+content=["']([^"']+)["']/i) ||
    get(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']og:title["']/i) ||
    get(/<h1[^>]*>([\s\S]*?)<\/h1>/i) ||
    get(/<title[^>]*>([\s\S]*?)<\/title>/i);
  const desc =
    get(/<meta[^>]+(?:name|property)=["'](?:description|og:description)["'][^>]+content=["']([^"']+)["']/i) ||
    get(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:name|property)=["'](?:description|og:description)["']/i);
  // 首个有实质内容的 <p>（跳过只有标签/图片的）
  let p = "";
  (raw.match(/<p[^>]*>[\s\S]*?<\/p>/gi) || []).forEach(tag => {
    if(p) return;
    const inner = tag.replace(/^<p[^>]*>|<\/p>$/gi, "").replace(/<(script|style)[\s\S]*?<\/\1>/gi, "");
    const t = stripMarkup(inner);
    if(t.replace(/\s/g, "").length >= 12) p = t;
  });
  return {title, desc, p};
}
/* Markdown 里抽取首个标题 / 首段 */
function mdPick(body){
  const lines = body.replace(/\r\n/g, "\n").split("\n");
  let p = "", hTitle = "", hLine = -1, pLine = -1, inCode = false;
  for(let i = 0; i < lines.length; i++){
    if(/^\s*```/.test(lines[i])){ inCode = !inCode; continue; }
    if(inCode) continue;
    const t = lines[i].trim();
    if(!t) continue;
    const mh = lines[i].match(/^#{1,6}\s+(.+?)\s*#*\s*$/);
    if(mh){ if(!hTitle){ hTitle = mh[1].trim(); hLine = i; } continue; }
    if(pLine < 0 && !/^(>|\||[-*+]\s|\d+[.)]\s|!\[|\[!|<!--|---|\*\*\*)/.test(t)){
      const plain = stripMarkup(t);
      if(plain.replace(/\s/g, "").length >= 12){ p = plain; pLine = i; }
    }
  }
  // 标题出现在正文之后 → 它多半只是正文里的一个小节标题，不当作文章标题
  if(hLine >= 0 && pLine >= 0 && hLine > pLine) hTitle = "";
  return {title: hTitle, p};
}
function parsePost(name, raw, extra){
  extra = extra || {};
  const isHtml = /\.html?$/i.test(name);
  const base = name.replace(/\.(md|markdown|html?)$/i,"");
  let meta = {}, body = raw;

  const styles = [], cssLinks = [];
  let rawHtml = "";

  if(isHtml){
    const c = raw.match(/<!--([\s\S]*?)-->/);
    if(c && /(?:^|\|)\s*(?:title|date|created|updated|summary|tags|tag|cover|draft)\s*:/i.test(c[1])){
      c[1].split("|").forEach(seg => {
        const i = seg.indexOf(":");
        if(i < 0) return;
        const k = seg.slice(0,i).trim().toLowerCase();
        let v = seg.slice(i+1).trim();
        if(k === "tags" || k === "tag"){
          meta.tags = v.replace(/^\[|\]$/g,"").split(/[,，、]/).map(s => s.trim()).filter(Boolean);
        } else meta[k] = v;
      });
      body = raw.replace(c[0], "");
    }
    rawHtml = body;                       // 原样文档：交给 iframe 完整渲染
    const pick = htmlPick(raw);
    if(!meta.title) meta.title = pick.title || prettyName(base);
    if(!meta.summary) meta.summary = pick.desc || pick.p;
    // ① 抽出作者自带的 <style>（片段型文章用，塞进 iframe 的 head）
    styles.push(...(body.match(/<style\b[^>]*>([\s\S]*?)<\/style>/gi) || []).map(s => s.replace(/^<style[^>]*>|<\/style>$/gi, "")));
    // ② 抽出外链 CSS（相对路径会在渲染时解析成仓库绝对地址再加载）
    (body.match(/<link\b[^>]*>/gi) || []).forEach(m => {
      const href = (m.match(/href\s*=\s*["']([^"']+)["']/i) || [])[1] || "";
      const relAttr = (m.match(/rel\s*=\s*["']([^"']+)["']/i) || [])[1] || "";
      if(/stylesheet/i.test(relAttr) || /\.css$/i.test(href)) cssLinks.push(href);
    });
    // ③ 片段型文章：只取 <body> 内容
    const bm = body.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    body = bm ? bm[1] : body.replace(/<\/?(html|head|body|!doctype)[^>]*>/gi, "");
    body = body.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, "").trim();
  } else {
    const r = parseFrontMatter(raw);
    meta = r.fm; body = r.body;
    const pick = mdPick(body);
    if(!meta.title) meta.title = pick.title || prettyName(base);
    if(!meta.summary) meta.summary = pick.p;
  }

  const tags = (Array.isArray(meta.tags) && meta.tags.length ? meta.tags : Array.isArray(extra.tags) ? extra.tags : []).filter(Boolean);
  const declaredTitle = isHtml ? /<!--[\s\S]*?\btitle\s*:/i.test(raw) : !!parseFrontMatter(raw).fm.title;
  const declaredSummary = isHtml ? /<!--[\s\S]*?\bsummary\s*:/i.test(raw) : !!parseFrontMatter(raw).fm.summary;
  if(!declaredTitle && extra.title) meta.title = extra.title;
  if(!declaredSummary && extra.summary) meta.summary = extra.summary;
  /* 日期优先级：手写 frontmatter > 仓库提交记录 > 文件名里的日期 */
  const handCreated = ((meta.date || meta.created || meta.created_at || "") + "").slice(0,10);
  const handUpdated = ((meta.updated || meta.modified || meta.last_modified_at || meta.updated_at || "") + "").slice(0,10);
  const gCreated = (extra.created || "").slice(0,10);
  const gUpdated = (extra.updated || "").slice(0,10);
  const nameDate = dateFromName(name);
  const created = handCreated || gCreated || nameDate || "";
  let updated = handUpdated || gUpdated || "";
  const plain = stripMarkup(body);
  return {
    name, base, isHtml, styles, cssLinks, rawHtml,
    scripts: String(meta.scripts||"").toLowerCase() === "true",
    title: (meta.title || base).trim(),
    created, updated,
    date: created,                                  // 兼容旧字段：列表排序用
    tags,
    autoTitle: !declaredTitle,                       // 无头信息时由正文/索引提取
    autoDate: !handCreated,
    autoSummary: !declaredSummary,
    summary: (meta.summary || plain).slice(0, 140),
    cover: meta.cover || "",
    draft: String(meta.draft||"").toLowerCase() === "true",
    body, plain,
    words: plain.replace(/\s/g,"").length
  };
}

/* ---------- Markdown 渲染（marked 优先，内置解析器兜底） ---------- */
function loadScript(src){
  return new Promise(res => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => res(true);
    s.onerror = () => res(false);
    setTimeout(() => res(false), 6000);
    document.head.appendChild(s);
  });
}
async function ensureRenderers(){
  const [a,b] = await Promise.all([
    loadScript("https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"),
    loadScript("https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js")
  ]);
  if(a && window.marked){ window.marked.setOptions({gfm:true, breaks:false}); }
  return {marked: a && window.marked, hljs: b && window.hljs};
}
function mdFallback(src){
  const blocks = [];
  let s = src.replace(/\r\n/g,"\n");
  s = s.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (m,lang,code) => {
    blocks.push('<pre><code class="language-' + esc(lang||"") + '">' + esc(code.replace(/\n$/,"")) + '</code></pre>');
    return "\u0000B" + (blocks.length-1) + "\u0000";
  });
  s = esc(s);
  const inline = t => t
    .replace(/`([^`]+)`/g, (m,c) => '<code>' + c + '</code>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,a,u) => '<img src="' + u + '" alt="' + a + '">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,a,u) => '<a href="' + u + '" target="_blank" rel="noopener">' + a + '</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");

  const out = [], lines = s.split("\n");
  let i = 0, listType = null;
  const closeList = () => { if(listType){ out.push("</" + listType + ">"); listType = null; } };
  while(i < lines.length){
    const line = lines[i];
    if(/^\u0000B\d+\u0000$/.test(line.trim())){ closeList(); out.push(line.trim()); i++; continue; }
    if(!line.trim()){ closeList(); i++; continue; }
    let m;
    if(m = line.match(/^(#{1,6})\s+(.*)$/)){
      closeList(); const lv = m[1].length;
      out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">"); i++; continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())){ closeList(); out.push("<hr>"); i++; continue; }
    if(/^\s*&gt;/.test(line)){
      closeList(); const q = [];
      while(i < lines.length && /^\s*&gt;/.test(lines[i])){ q.push(lines[i].replace(/^\s*&gt;\s?/,"")); i++; }
      out.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>"); continue;
    }
    if(/^\s*\|.*\|/.test(line) && i+1 < lines.length && /^\s*\|[\s:|-]+\|/.test(lines[i+1])){
      closeList();
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c => c.trim());
      const head = cells(lines[i]); i += 2; const rows = [];
      while(i < lines.length && /\|/.test(lines[i]) && lines[i].trim()){ rows.push(cells(lines[i])); i++; }
      out.push("<table><thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    if(m = line.match(/^\s*[-*+]\s+(.*)$/)){
      if(listType !== "ul"){ closeList(); out.push("<ul>"); listType = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>"); i++; continue;
    }
    if(m = line.match(/^\s*\d+[.)]\s+(.*)$/)){
      if(listType !== "ol"){ closeList(); out.push("<ol>"); listType = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>"); i++; continue;
    }
    closeList();
    const p = [];
    while(i < lines.length && lines[i].trim() && !/^(#{1,6}\s|[-*+]\s|\d+[.)]\s|\s*>|\||\u0000B)/.test(lines[i])){
      p.push(lines[i]); i++;
    }
    if(p.length) out.push("<p>" + inline(p.join("\n")).replace(/\n/g,"<br>") + "</p>");
    else { out.push("<p>" + inline(line) + "</p>"); i++; }
  }
  closeList();
  return out.join("\n").replace(/\u0000B(\d+)\u0000/g, (m,n) => blocks[+n]);
}
function renderBody(p, r){
  if(p.isHtml) return p.body;
  try{
    if(r.marked) return window.marked.parse(p.body);
  }catch(e){}
  return mdFallback(p.body);
}

/* ---------- 缓存：仅作为加载加速和短暂离线回退，静态索引是唯一权威 ---------- */
function readCache(){
  try{
    const c = JSON.parse(safeStore.get(CACHE_KEY) || "null");
    return c && Array.isArray(c.posts) ? c : null;
  }catch(e){ return null; }
}
function writeCache(){
  safeStore.set(CACHE_KEY, JSON.stringify({
    ts:state.syncedAt, branch:cfg.branch, generated:state.generated,
    posts:state.posts.map(p => ({
      name:p.name, sha:p.sha, path:p.path,
      meta:{title:p.title,created:p.created,updated:p.updated,tags:p.tags,summary:p.summary,
        cover:p.cover,draft:p.draft,isHtml:p.isHtml,words:p.words,
        autoTitle:p.autoTitle,autoSummary:p.autoSummary,styles:p.styles,
        cssLinks:p.cssLinks,scripts:p.scripts,rawHtml:p.rawHtml},
      raw:p.body
    }))
  }));
}
function hydrate(c){
  return c.posts.map(p => Object.assign(
    parsePost(p.name,p.raw||"",{}),
    {sha:p.sha,path:p.path||(cfg.blogDir+"/"+p.name)},p.meta||{}
  )).filter(p => !p.draft);
}
async function refresh(force=false){
  const seq = ++syncSequence;
  state.refreshing = true;
  if(!state.hasList) state.loading = true;
  render();
  let got;
  try { got = await fetchList(); }
  catch(e){
    if(seq !== syncSequence) return;
    state.refreshing = false;
    state.loading = false;
    state.offline = true;
    // 错误只描述「站点索引」；不再错误地归因于 GitHub API 频率限制。
    state.error = state.hasList ? "" : "INDEX_UNAVAILABLE";
    render();
    return;
  }
  if(seq !== syncSequence) return;
  const old = new Map(state.posts.map(p => [p.name,p]));
  const out = [];
  for(const f of got.files){
    const m = f.meta || {};
    const prev = old.get(f.name);
    if(!force && prev && prev.sha === f.sha && prev.body !== undefined){
      // 从最新索引更新日期，确保已更改的提交日期能够同步。
      if(m.created) prev.created = m.created;
      if(m.updated) prev.updated = m.updated;
      if(m.summary && prev.autoSummary) prev.summary = m.summary;
      prev.date = prev.created;
      out.push(prev);
    }else{
      out.push({name:f.name,path:f.path,sha:f.sha,_need:true,_meta:m});
    }
  }
  // 一旦新索引返回零文章，就丢弃旧缓存，不允许被删除的文章复活。
  if(!out.length){
    state.posts=[];
    state.hasList=true;
    state.generated=got.generated;
    state.loading=false;
    state.refreshing=false;
    state.offline=false;
    state.error="";
    state.syncedAt=Date.now();
    writeCache(); render(); return;
  }
  let failed=0;
  await pool(out.filter(p=>p._need),4,async p=>{
    try{
      const raw=await getLocalText(localRepoUrl(p.path)+"?v="+encodeURIComponent(p.sha||Date.now()),10000);
      Object.assign(p,parsePost(p.name,raw,p._meta));
      delete p._need;
    }catch(e){
      failed++;
      const prev=old.get(p.name);
      if(prev){
        Object.assign(p,prev);
        delete p._need;
      }else p._dead=true;
    }
  });
  if(seq !== syncSequence) return;
  state.posts=out.filter(p=>!p._dead&&!p.draft&&p.body!==undefined)
    .sort((a,b)=>(b.created||"").localeCompare(a.created||"")||b.name.localeCompare(a.name));
  state.hasList=true;
  state.generated=got.generated;
  state.loading=false;
  state.refreshing=false;
  state.offline=false;
  state.error=failed ? failed + " 篇文章正文暂时无法加载，其他文章可以正常阅读。" : "";
  state.syncedAt=Date.now();
  writeCache(); render();
}

/* ---------- 渲染：首页 ---------- */
function filtered(){
  const q = state.q.trim().toLowerCase();
  return state.posts.filter(p => {
    if(state.tag && !p.tags.includes(state.tag)) return false;
    if(!q) return true;
    return (p.title + " " + p.summary + " " + p.plain + " " + p.tags.join(" ")).toLowerCase().includes(q);
  });
}
function fmtDate(d){
  if(!d) return "";
  const p = d.split("-");
  return p.length === 3 ? p.join(".") : d;
}
function highlight(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}
/* 只有真正缺失索引时才提示；空文章列表是一种正常状态。 */

}

  } else {

/* 文件名模糊匹配：链接里的名字和仓库里的名字不完全一致时也能打开 */
function normName(s){
  return String(s || "").replace(/\.(md|markdown|html?)$/i, "")
    .replace(/[\s._\-·•、,，:：/\\()（）\[\]【】!！?？~+'"“”‘’*#&%]/g, "").toLowerCase();
}
function findPost(name){
  const exact = state.posts.find(x => x.name === name);
  if(exact) return exact;
  const n = normName(name);
  if(!n || !state.posts.length) return null;
  const pool = state.posts.map(x => ({p:x, m:normName(x.name)}));
  const same = pool.filter(o => o.m === n);
  if(same.length === 1) return same[0].p;
  const near = pool.filter(o => o.m && (o.m.startsWith(n) || n.startsWith(o.m)));
  if(near.length === 1) return near[0].p;
  if(near.length > 1){
    const best = near.sort((a,b) => Math.abs(b.m.length - n.length) - Math.abs(a.m.length - n.length))[0];
    return best.p;
  }
  return null;
}
function suggestHTML(name){
  const n = normName(name);
  const scored = state.posts.map(p => {
    const m = normName(p.name);
    let s = 0;
    for(let i = 0; i < Math.min(m.length, n.length); i++){ if(m[i] === n[i]) s++; else break; }
    if(m && n && (m.includes(n) || n.includes(m))) s += 10;
    return {p, s};
  }).filter(o => o.s > 2).sort((a,b) => b.s - a.s).slice(0, 5);
  if(!scored.length) return "";
  return `<div style="margin-top:20px;font-size:13px;color:var(--fg-soft)">你可能要找的是</div>
    <div style="margin-top:10px;display:grid;gap:8px;justify-content:center">` +
    scored.map(o => `<a class="chip" style="display:block" href="#/p/${encodeURIComponent(o.p.name)}">${esc(o.p.title)}</a>`).join("") +
    `</div>`;
}

/* ---------- 路由与渲染 ---------- */
let renderers = {marked:false, hljs:false};
function render(){
  const h = location.hash.replace(/^#/, "");
  const app = $("#app");
  if(h.startsWith("/p/")){
    const name = decodeURIComponent(h.slice(3));
    const p = findPost(name);
    if(!p){
      if(state.loading){
        app.innerHTML = `<div class="wrap"><div class="skel" style="margin-top:40px"><i style="width:40%"></i></div></div>`;
      } else {
        app.innerHTML = `<div class="wrap"><div class="empty"><div class="big">404</div><div>找不到这篇文章</div>
          <div style="margin-top:6px;font-size:13px;opacity:.75">${esc(name)}</div>
          ${suggestHTML(name)}
          <div style="margin-top:18px"><a class="chip" href="#/">返回首页</a></div></div></div>`;
      }
      return;
    }
    clearInjected();
    app.innerHTML = postHTML(p, renderers);
    document.body.classList.toggle("raw-mode", !!p.isHtml);
    document.documentElement.classList.toggle("raw-mode", !!p.isHtml);
    document.title = p.title + " · " + cfg.title;
    afterPost(p);
  } else {
    document.body.classList.remove("raw-mode");
    document.documentElement.classList.remove("raw-mode");
    if(h.startsWith("/tag/")) state.tag = decodeURIComponent(h.slice(5));
    else if(h === "" || h === "/") state.tag = "";
    app.innerHTML = homeHTML();
    document.title = cfg.title + " · Blog";
    $("#q").value = state.q;
    $("#searchWrap").classList.toggle("has", !!state.q);
  }
}
function setTag(t){
  state.tag = t;
  location.hash = t ? "#/tag/" + encodeURIComponent(t) : "#/";
  if(!t) render();
}
window.setTag = setTag;
window.refresh = refresh;

/* 注入作者自带样式（带作用域） */
let styleSeq = 0;
function injectStyle(css){
  if(!css || !css.trim()) return;
  const s = document.createElement("style");
  s.id = "raw-style-" + (++styleSeq);
  s.textContent = css;
  document.head.appendChild(s);
}
function clearInjected(){
  document.querySelectorAll("style[id^=raw-style-]").forEach(s => s.remove());
}
/* 解析单个媒体地址：相对路径 → 仓库绝对地址 */
function resolveMedia(url){
  if(!url) return "";
  const rp = relToRepoPath(url);
  return rp ? assetURLs(rp)[0] : url;
}
/* 把正文里所有相对路径资源改写到 blog/ 为根的仓库地址 */
function rewriteAssets(root){
  root.querySelectorAll("[src],[href],[poster],[data-src]").forEach(el => {
    ["src","href","poster","data-src"].forEach(attr => {
      if(!el.hasAttribute(attr)) return;
      const v = el.getAttribute(attr);
      const rp = relToRepoPath(v);
      if(!rp) return;
      const urls = assetURLs(rp);
      // 指向另一篇文章的相对链接 → 转成站内路由
      if(el.tagName === "A" && /\.(md|markdown|html?)$/i.test(rp)){
        const fname = rp.split("/").pop();
        const target = state.posts.find(x => x.name === fname);
        if(target){ el.setAttribute(attr, "#/p/" + encodeURIComponent(target.name)); return; }
      }
      el.setAttribute(attr, urls[0]);
      if(el.tagName === "IMG" || el.tagName === "SOURCE"){
        let k = 0;
        el.onerror = () => { k++; if(k < urls.length) el.setAttribute(attr, urls[k]); };
      }
    });
  });
}

/* ---------- 原始 HTML：iframe 挂载 ----------
   说明：iframe 固定等于可视区高度，让文章在自己的视口里滚动
   —— 与独立打开完全一致（sticky 导航、滚动进度条、vh 布局全部正常）。
   不做「自动撑高」：文章里若有 vh 单位，撑高会让内容变高、陷入死循环。 */
function applyFrameHeight(){
  const fr = $("#rawFrame");
  if(!fr) return;
  const top = fr.getBoundingClientRect().top + window.scrollY;
  fr.style.height = Math.max(420, Math.round(window.innerHeight - top - 14)) + "px";
}
function mountRawFrame(p){
  const fr = $("#rawFrame");
  if(!fr) return;
  const built = buildRawDoc(p);
  applyFrameHeight();
  fr.onload = () => { try{ applyFrameHeight(); }catch(e){} };
  fr.srcdoc = injectHelper(built.html, built.alt);
}
window.addEventListener("message", e => {
  const d = e.data;
  if(!d || d.__bf !== "scroll") return;
  const fr = $("#rawFrame");
  if(!fr || !fr.contentWindow || e.source !== fr.contentWindow) return;
  try{ fr.contentWindow.scrollTo({top: Math.max(0, d.y), behavior:"smooth"}); }catch(err){}
});
window.addEventListener("resize", applyFrameHeight);

function afterPost(p){
  // 原始 HTML：整篇塞进 iframe，自带样式/脚本/布局全部原样生效
  if(p.isHtml){ mountRawFrame(p); return; }
  const body = $("#mdBody");
  // ① 相对路径资源（图片/附件/文章互链）统一以 blog/ 为根解析
  rewriteAssets(body);
  // ② 可选：执行文章内脚本（需在元信息里写 scripts: true）
  if(p.scripts){
    body.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }
  // 代码块：高亮 + 复制
  body.querySelectorAll("pre").forEach(pre => {
    const code = pre.querySelector("code") || pre;
    if(renderers.hljs){ try{ window.hljs.highlightElement(code); }catch(e){} }
    const btn = document.createElement("button");
    btn.className = "copy"; btn.textContent = "复制";
    btn.onclick = () => {
      navigator.clipboard.writeText(code.innerText).then(() => {
        btn.textContent = "已复制"; btn.classList.add("done");
        setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("done"); }, 1600);
      });
    };
    pre.appendChild(btn);
  });
  // 外链新窗口
  body.querySelectorAll("a[href^=http]").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  // 图片灯箱
  body.querySelectorAll("img").forEach(img => {
    img.onclick = () => { const lb = $("#lb"); lb.querySelector("img").src = img.src; lb.classList.add("on"); };
  });
  // 目录
  const toc = $("#toc");
  const hs = body.querySelectorAll("h2,h3");
  if(hs.length > 1){
    let html = '<div class="t">目录</div>';
    hs.forEach((el, i) => {
      const id = "sec-" + i; el.id = id;
      html += `<a href="#${id}" data-id="${id}" class="${el.tagName === "H3" ? "lv3" : ""}">${esc(el.textContent)}</a>`;
    });
    toc.innerHTML = html;
    const mobileLinks = $(".toc-mobile-links");
    if(mobileLinks){ mobileLinks.innerHTML = html.replace('<div class="t">目录</div>', ''); }
    const mobileToc = $("#tocMobile");
    if(mobileToc){
      mobileToc.querySelectorAll("a").forEach(a => {
        a.onclick=e=>{
          e.preventDefault();
          const target = document.getElementById(a.dataset.id);
          mobileToc.open=false;
          if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
        };
      });
    }
    toc.querySelectorAll("a").forEach(a => {
      a.onclick = e => {
        e.preventDefault();
        const t = document.getElementById(a.dataset.id);
        window.scrollTo({top: t.getBoundingClientRect().top + window.scrollY - 78, behavior:"smooth"});
      };
    });
    const links = [...toc.querySelectorAll("a")];
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(en.isIntersecting){
          links.forEach(a => a.classList.toggle("on", a.dataset.id === en.target.id));
        }
      });
    }, {rootMargin:"-80px 0px -72% 0px"});
    hs.forEach(el => io.observe(el));
  } else {
    toc.innerHTML = "";
    const mobileToc = $("#tocMobile");
    if(mobileToc) mobileToc.remove();
  }
}

/* ---------- 交互 ---------- */
function onScroll(){
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  $("#bar").style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
  $("#totop").classList.toggle("show", h.scrollTop > 420);
}
function initUI(){
  const saved = safeStore.get("khtao_theme");
  const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#theme").onclick = () => {
    const now = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = now;
    safeStore.set("khtao_theme", now);
  };

  let timer;
  $("#q").addEventListener("input", e => {
    clearTimeout(timer);
    const v = e.target.value;
    $("#searchWrap").classList.toggle("has", !!v);
    timer = setTimeout(() => {
      state.q = v;
      if(!location.hash.startsWith("/p")) render(); else { state.q = v; location.hash = "#/"; render(); }
    }, 180);
  });
  $("#clearQ").onclick = () => {
    $("#q").value = ""; state.q = ""; $("#searchWrap").classList.remove("has"); render();
  };
  $("#totop").onclick = () => window.scrollTo({top:0, behavior:"smooth"});
  $("#refresh").classList.add("show");
  $("#refresh").onclick = () => refresh(true);
  $("#lb").onclick = () => $("#lb").classList.remove("on");
  document.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
    if(e.key === "Escape") $("#lb").classList.remove("on");
  });
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("hashchange", () => { window.scrollTo(0,0); render(); onScroll(); });
}

/* ---------- 启动：先渲染缓存（秒开），再静默同步 ---------- */
(async function init(){
  initUI();
  await loadConfig();
  const c = readCache();
  if(c){
    cfg.branch = c.branch || cfg.branch;
    state.posts = hydrate(c);
    state.syncedAt = c.ts;
    state.loading = false;
    state.offline = false;
    state.hasList = true;
    state.generated = c.generated || "";
    render();
  }
  // 首屏索引同步不受外部 Markdown 高亮 CDN 影响。
  const renderersPending = ensureRenderers();
  await refresh(false);
  renderers = await renderersPending;
  if(location.hash.startsWith("#/p/")) render();
  onScroll();
  /* 每 5 分钟从站点自己的索引同步一次；包括删除最后一篇文章的情况。 */
  setInterval(() => { if(!document.hidden) refresh(false); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && Date.now() - state.syncedAt > 60000) refresh(false);
  });
})();
</script>
