<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#ffffff; --bg-soft:#f6f7f9; --hover-bg:#f4f5f8;
  --fg:#16181d; --fg-mid:#4c5158; --fg-soft:#6f747e;
  --line:#e9eaee; --line-soft:#f1f2f5;
  --accent:#4a5bd6; --accent-soft:rgba(74,91,214,.09);
  --card:#ffffff; --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --code-bg:#f7f8fa;
  --radius:14px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme="dark"]{
  --bg:#0e1117; --bg-soft:#151a22; --hover-bg:#181d26;
  --fg:#e7e9ee; --fg-mid:#b0b6c0; --fg-soft:#7c838f;
  --line:#232935; --line-soft:#1c222c;
  --accent:#93a5ff; --accent-soft:rgba(147,165,255,.14);
  --card:#131822; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  --code-bg:#0d1117;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px; line-height:1.7; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .28s ease,color .28s ease;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;}

/* ============ 顶部 ============ */
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;background:transparent;}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear;}
.site-header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.nav{max-width:1120px;margin:0 auto;padding:0 24px;height:62px;display:flex;align-items:center;gap:18px;}
.brand{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;}
.brand small{font-weight:500;color:var(--fg-soft);margin-left:8px;font-size:13px;letter-spacing:0;}
.nav-spacer{flex:1;}
.search{position:relative;flex:0 1 260px;}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;width:15px;height:15px;}
.search input{
  width:100%;height:38px;padding:0 34px 0 34px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg-soft);color:var(--fg);
  font-size:14px;font-family:inherit;transition:.2s;
}
.search input:focus{outline:none;border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 3px var(--accent-soft);}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;pointer-events:none;
  width:22px;height:22px;border-radius:50%;color:var(--fg-soft);font-size:15px;line-height:1;display:grid;place-items:center;}
.search.has .clear{opacity:1;pointer-events:auto;}
.search .clear:hover{background:var(--hover-bg);}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--fg-mid);transition:.18s;flex:none;
}
.icon-btn:hover{background:var(--hover-bg);color:var(--fg);}
.icon-btn svg{width:18px;height:18px;}
[data-theme="dark"] .i-moon{display:none;}
.i-sun{display:none;}
[data-theme="dark"] .i-sun{display:block;}

/* ============ 布局 ============ */
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
main{min-height:60vh;}

/* Hero */
.hero{padding:78px 0 44px;}
.hero h1{
  margin:0;font-size:clamp(34px,5.2vw,54px);line-height:1.12;font-weight:800;letter-spacing:-.035em;
  background:linear-gradient(92deg,var(--fg) 20%,var(--accent));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero p{margin:16px 0 0;font-size:17px;color:var(--fg-soft);max-width:620px;}
.hero-meta{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--fg-soft);}
.dot{width:3px;height:3px;border-radius:50%;background:var(--fg-soft);opacity:.6;}

/* 标签栏 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0 26px;}
.chip{
  padding:6px 13px;border-radius:999px;font-size:13px;color:var(--fg-mid);
  border:1px solid var(--line);background:var(--bg);transition:.16s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
[data-theme="dark"] .chip.on{color:#0e1117;}
.chip .n{opacity:.55;margin-left:5px;font-size:12px;}

/* 文章列表 */
.list-title{font-size:13px;color:var(--fg-soft);margin:0 0 6px;letter-spacing:.04em;}
.post-item{
  display:grid;grid-template-columns:104px 1fr;gap:22px;align-items:baseline;
  padding:24px 22px;margin:0 -22px;border-radius:var(--radius);
  border-bottom:1px solid var(--line-soft);transition:background .18s;
}
.post-item:last-child{border-bottom:none;}
.post-item:hover{background:var(--hover-bg);border-bottom-color:transparent;}
.post-date{font-family:var(--mono);font-size:12.5px;color:var(--fg-soft);letter-spacing:.02em;padding-top:5px;}
.post-title{margin:0;font-size:20px;font-weight:650;letter-spacing:-.015em;line-height:1.45;transition:color .16s;}
.post-item:hover .post-title{color:var(--accent);}
.post-sum{margin:8px 0 0;font-size:14.5px;color:var(--fg-soft);line-height:1.72;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.post-tags{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.tag-mini{font-size:12px;color:var(--fg-soft);background:var(--bg-soft);padding:3px 9px;border-radius:6px;}
mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px;}

.post-date em{display:block;font-style:normal;font-size:11px;opacity:.72;margin-top:2px;white-space:nowrap;}
.banner.soft{background:var(--bg-soft);border-style:dashed;}
.banner.err{background:rgba(217,74,74,.09);border-color:rgba(217,74,74,.3);color:var(--fg-mid);}
.banner button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg-mid);}
.banner button.ghost:hover{border-color:var(--accent);color:var(--accent);}

/* 骨架/空/错误 */
.skel{padding:24px 0;border-bottom:1px solid var(--line-soft);}
.skel i{display:block;height:13px;border-radius:6px;background:var(--bg-soft);
  background:linear-gradient(90deg,var(--bg-soft) 25%,var(--hover-bg) 37%,var(--bg-soft) 63%);
  background-size:400% 100%;animation:sh 1.4s ease infinite;}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{padding:70px 0;text-align:center;color:var(--fg-soft);}
.empty .big{font-size:34px;opacity:.35;margin-bottom:12px;}
.banner{
  margin:20px 0;padding:14px 16px;border-radius:12px;font-size:14px;
  background:var(--accent-soft);color:var(--fg-mid);border:1px solid var(--line);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.banner button{padding:6px 12px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;}
[data-theme="dark"] .banner button{color:#0e1117;}

/* ============ 文章页 ============ */
.post-layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:56px;max-width:1120px;margin:0 auto;padding:52px 24px 80px;align-items:start;}
.post-main{min-width:0;max-width:742px;}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg-soft);transition:.16s;margin-bottom:26px;}
.back:hover{color:var(--accent);}
.post-head h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.28;font-weight:800;letter-spacing:-.03em;}
.post-meta{margin:16px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13.5px;color:var(--fg-soft);}
.post-cover{margin:28px 0 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
.post-cover img{display:block;width:100%;}
.post-divider{height:1px;background:var(--line);margin:32px 0 6px;}

/* Markdown 正文 */
.md{font-size:16.5px;line-height:1.86;color:var(--fg);word-wrap:break-word;}
.md>*:first-child{margin-top:8px;}
.md h1,.md h2,.md h3,.md h4{letter-spacing:-.02em;line-height:1.4;font-weight:700;scroll-margin-top:84px;}
.md h1{font-size:28px;margin:2em 0 .8em;}
.md h2{font-size:23px;margin:2.2em 0 .8em;padding-bottom:.3em;border-bottom:1px solid var(--line-soft);}
.md h3{font-size:19px;margin:1.9em 0 .7em;}
.md h4{font-size:16.5px;margin:1.6em 0 .6em;}
.md p{margin:1.05em 0;}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);}
.md a:hover{border-bottom-color:var(--accent);}
.md strong{font-weight:680;}
.md ul,.md ol{margin:1.05em 0;padding-left:1.5em;}
.md li{margin:.42em 0;}
.md li::marker{color:var(--fg-soft);}
.md blockquote{
  margin:1.6em 0;padding:.2em 0 .2em 18px;border-left:3px solid var(--accent);
  color:var(--fg-mid);background:linear-gradient(90deg,var(--accent-soft),transparent);
  border-radius:0 8px 8px 0;
}
.md blockquote p{margin:.5em 0;}
.md hr{margin:2.6em 0;border:none;height:1px;background:var(--line);}
.md img{max-width:100%;border-radius:12px;margin:1.6em 0;display:block;cursor:zoom-in;border:1px solid var(--line-soft);}
.md table{border-collapse:collapse;width:100%;margin:1.6em 0;font-size:15px;display:block;overflow-x:auto;}
.md th,.md td{border:1px solid var(--line);padding:9px 14px;text-align:left;}
.md th{background:var(--bg-soft);font-weight:650;}
.md code{
  font-family:var(--mono);font-size:.88em;background:var(--bg-soft);
  padding:.16em .4em;border-radius:6px;border:1px solid var(--line-soft);
}
.md pre{
  position:relative;background:var(--code-bg);border:1px solid var(--line-soft);
  border-radius:12px;padding:16px 18px;overflow-x:auto;margin:1.6em 0;line-height:1.68;
}
.md pre code{background:none;border:none;padding:0;font-size:13.5px;line-height:1.68;}
.md .copy{
  position:absolute;top:9px;right:9px;font-size:12px;padding:4px 9px;border-radius:7px;
  background:var(--bg);border:1px solid var(--line);color:var(--fg-soft);opacity:0;transition:.16s;
}
.md pre:hover .copy{opacity:1;}
.md .copy:hover{color:var(--accent);border-color:var(--accent);}
.md .copy.done{color:#12a150;border-color:#12a150;}

/* 代码高亮配色 */
.hljs-comment,.hljs-quote{color:#9aa0ab;font-style:italic;}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-doctag,.hljs-formula{color:#a626a4;}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute,.hljs-meta .hljs-string{color:#50a14f;}
.hljs-number,.hljs-variable,.hljs-template-variable,.hljs-type,.hljs-selector-class,.hljs-selector-attr,.hljs-selector-pseudo{color:#b76b01;}
.hljs-title,.hljs-section,.hljs-title.class_,.hljs-title.function_{color:#4078f2;}
.hljs-attr,.hljs-params,.hljs-symbol,.hljs-bullet,.hljs-link{color:#c18401;}
.hljs-built_in,.hljs-name,.hljs-tag{color:#e45649;}
.hljs-deletion{color:#f07178;}
.hljs-emphasis{font-style:italic;}
.hljs-strong{font-weight:700;}
[data-theme="dark"] .hljs-comment,.hljs-quote{color:#5c6370;}
[data-theme="dark"] .hljs-keyword,.hljs-selector-tag,[data-theme="dark"] .hljs-literal{color:#c678dd;}
[data-theme="dark"] .hljs-string,[data-theme="dark"] .hljs-regexp,[data-theme="dark"] .hljs-addition,[data-theme="dark"] .hljs-attribute{color:#98c379;}
[data-theme="dark"] .hljs-number,[data-theme="dark"] .hljs-type,[data-theme="dark"] .hljs-selector-class{color:#d19a66;}
[data-theme="dark"] .hljs-title,[data-theme="dark"] .hljs-title.class_,[data-theme="dark"] .hljs-title.function_{color:#61afef;}
[data-theme="dark"] .hljs-attr,[data-theme="dark"] .hljs-params,[data-theme="dark"] .hljs-symbol{color:#e5c07b;}
[data-theme="dark"] .hljs-built_in,[data-theme="dark"] .hljs-name,[data-theme="dark"] .hljs-tag{color:#e06c75;}

/* ============ 原始 HTML 文章：iframe 隔离渲染，作者样式 100% 说了算 ============ */
.btn-s{padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg-mid);font-size:12.5px;font-weight:600;transition:.16s;white-space:nowrap;}
.btn-s:hover{border-color:var(--accent);color:var(--accent);}
.btn-s.on{background:var(--accent);border-color:var(--accent);color:#fff;}
[data-theme="dark"] .btn-s.on{color:#0e1117;}
.raw-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 0;}
.raw-head .sp{flex:1;}
.raw-head .lb{font-size:11px;letter-spacing:1.2px;font-weight:700;color:var(--fg-soft);
  background:var(--bg-soft);border:1px solid var(--line);padding:3px 9px;border-radius:99px;}
/* iframe 版式：与 Markdown 阅读页共用 --post-width，保证两种文章宽度一致 */
.post-layout.raw{grid-template-columns:minmax(0,1fr);gap:0;max-width:var(--post-width);
  padding:32px var(--post-pad-x) 60px;}
.post-layout.raw .post-main{max-width:none;min-width:0;}
.raw-title{padding:6px 2px 14px;}
.raw-title h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.028em;line-height:1.3;margin:0;}
.raw-title .post-meta{margin:10px 0 0;}
/* 高度由 JS 按文章真实长度写入；overflow:hidden 兜住最后 1–2px 的取整误差 */
.raw-frame{display:block;width:100%;border:0;background:#fff;border-radius:12px;
  border:1px solid var(--line-soft);box-shadow:var(--soft-shadow);overflow:hidden;}
.raw-tip{font-size:12px;color:var(--fg-soft);padding:10px 2px 0;}
/* 目录浮层：不占布局，展开收起都不改变正文宽度 */
.raw-toc{position:fixed;top:76px;right:18px;z-index:45;width:216px;max-height:calc(100vh - 140px);
  overflow-y:auto;padding:12px 12px 12px 4px;border-radius:12px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;display:none;}
.raw-toc.on{display:block;}
.raw-toc .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-soft);
  padding:0 0 8px 12px;display:flex;align-items:center;}
.raw-toc .close{margin-left:auto;border:0;background:none;color:var(--fg-soft);font-size:15px;line-height:1;padding:2px 4px;}
.raw-toc .close:hover{color:var(--accent);}
.raw-toc a{display:block;padding:5px 0 5px 12px;color:var(--fg-soft);line-height:1.5;
  border-left:2px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.raw-toc a:hover{color:var(--fg);}
.raw-toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600;}
.raw-toc a.lv3{padding-left:24px;font-size:12.5px;}
.raw-toc::-webkit-scrollbar{width:3px;}
.raw-toc::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
@media(max-width:1199px){
  .raw-toc{top:auto;bottom:0;left:0;right:0;width:auto;max-height:52vh;border-radius:14px 14px 0 0;}
}

/* TOC */
.toc{position:sticky;top:88px;font-size:13.5px;max-height:calc(100vh - 130px);overflow-y:auto;}
.toc .t{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft);margin-bottom:12px;}
.toc a{
  display:block;padding:5px 0 5px 14px;color:var(--fg-soft);line-height:1.5;
  border-left:2px solid var(--line);transition:.15s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.toc a:hover{color:var(--fg);}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600;}
.toc a.lv3{padding-left:26px;font-size:12.5px;}
.toc::-webkit-scrollbar{width:3px;}
.toc::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

/* 文章底部 */
.post-foot{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--fg-soft);}
.post-foot a:hover{color:var(--accent);}

/* 页脚 */
footer{border-top:1px solid var(--line);margin-top:40px;}
.foot{max-width:1120px;margin:0 auto;padding:28px 24px 40px;color:var(--fg-soft);font-size:13px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

/* 悬浮按钮 */
.float{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;flex-direction:column;gap:10px;}
.float button{
  width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg-mid);transition:.18s;opacity:0;pointer-events:none;
}
.float button.show{opacity:1;pointer-events:auto;}
.float button:hover{color:var(--accent);transform:translateY(-2px);}
.float svg{width:17px;height:17px;}

/* 灯箱 */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(12,14,18,.92);display:none;place-items:center;padding:30px;cursor:zoom-out;}
.lightbox.on{display:grid;}
.lightbox img{max-width:100%;max-height:94vh;border-radius:8px;}

/* 响应式 */
@media (max-width:1080px){
  .post-layout{grid-template-columns:1fr;gap:0;}
  .toc{display:none;}
}
@media (max-width:640px){
  .nav{padding:0 16px;gap:10px;}
  .brand small{display:none;}
  .search{flex:1 1 auto;max-width:none;}
  .hero{padding:48px 0 30px;}
  .wrap,.post-layout{padding-left:16px;padding-right:16px;}
  .post-item{grid-template-columns:1fr;gap:6px;padding:20px 14px;margin:0 -14px;}
  .post-date{padding-top:0;}
  .post-title{font-size:18.5px;}
  .toc{display:none;}
}

/* ============ v3 · editorial refinement ============ */
:root{
  --bg:#fcfcfe; --bg-soft:#f3f4f9; --hover-bg:#f4f5fb;
  --fg:#202335; --fg-mid:#485064; --fg-soft:#788195;
  --line:#e6e8f0; --line-soft:#eceef4;
  --accent:#5b5bd6; --accent-soft:rgba(91,91,214,.085);
  --card:#ffffff; --radius:18px;
}
[data-theme="dark"]{
  --bg:#0f121b; --bg-soft:#171c29; --hover-bg:#1b2130;
  --fg:#eceefa; --fg-mid:#bbc0d1; --fg-soft:#858da3;
  --line:#293043; --line-soft:#21283a;

:root{--paper:#fff;--tint:rgba(91,91,214,.045);}
[data-theme="dark"]{--paper:#171c29;--tint:rgba(166,173,255,.07);}

.nav-link.active{color:var(--accent);background:var(--accent-soft);font-weight:700;}
.nav-link.active::after{content:"";position:absolute;bottom:3px;left:calc(50% - 3px);width:6px;height:2px;background:var(--accent);border-radius:2px;}
.nav .search{flex:0 1 214px;}

/* Khtao Blog 3.0 · Mobile Markdown reading layout hotfix
 * Place this after the existing CSS overrides, at the end of the stylesheet.
 * Earlier .post-layout desktop rules appeared after the old 1080px media query,
 * unintentionally restoring the 216px TOC column on phones.
 */
@media (max-width: 1080px) {
  .post-layout:not(.raw) {
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }
  .post-layout:not(.raw) > .post-main {
    width: 100%;
    min-width: 0;
    max-width: 718px;
    margin-inline: auto;
  }
  .post-layout:not(.raw) > .toc {
    display: none;
  }
}
@media (max-width: 640px) {
  .post-layout:not(.raw) {
    padding: 28px 18px 56px;
  }
  .post-layout:not(.raw) > .post-main {
    max-width: 100%;
  }
  .post-head h1 {
    font-size: clamp(27px, 7.4vw, 32px);
    line-height: 1.38;
    letter-spacing: -.035em;
    overflow-wrap: anywhere;
  }
  .post-meta {
    gap: 6px 10px;
    margin-top: 15px;
    font-size: 12px;
    line-height: 1.65;
  }
  .post-meta > .dot { display: none; }
  .post-meta > .tag-mini {
    max-width: 100%;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  .post-cover { margin-top: 22px; }
  .post-cover img { max-width: 100%; height: auto; }
  .post-divider { margin-top: 26px; }
  .reading-tools { flex-wrap: wrap; }
  .reading-actions { min-width: 0; flex-wrap: wrap; justify-content: flex-end; }
  .md { min-width: 0; overflow-wrap: anywhere; }
  .md h1 { font-size: 25px; }
  .md h2 { font-size: 21px; }
  .md h3 { font-size: 18px; }
  .md img, .md video, .md iframe, .md svg { max-width: 100%; height: auto; }
  .md pre, .md table {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .md pre code { white-space: pre; }
  .post-related { grid-template-columns: minmax(0, 1fr); }
  .post-related a:last-child { text-align: left; }
}

/* ===== Khtao Blog 3.0 · 阅读宽度与 HTML 原样展示页保持一致 =====
 * Markdown 阅读页与 .raw（HTML 原样渲染）共用 --post-width / --post-pad-x，
 * 宽屏下不再无限拉宽：两份版式的可视宽度完全相同。
 * 仅作用于 Markdown 阅读页，不影响首页、归档、话题与 HTML 原样模式（.raw）。
 */
.post-layout:not(.raw) {
  width: 100%;
  max-width: var(--post-width);
  margin-inline: auto;
  padding-left: var(--post-pad-x);
  padding-right: var(--post-pad-x);
  grid-template-columns: minmax(0, 1fr) 210px;
  column-gap: clamp(28px, 3.5vw, 56px);
}
.post-layout:not(.raw) > .post-main {
  width: 100%;
  max-width: none;
  min-width: 0;
}
/* 视口不足以舒适并排展示时，正文独占一整行，目录折叠收起。 */
@media (max-width: 1199px) {
  .post-layout:not(.raw) {
    max-width: none;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }
  .post-layout:not(.raw) > .toc { display: none; }
  .post-layout:not(.raw) .toc-mobile {
    display: block;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    border-radius: 12px;
    margin: 22px 0 26px;
  }
  .post-layout:not(.raw) .toc-mobile summary {
    padding: 11px 15px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 650;
    color: var(--fg-mid);
  }
  .post-layout:not(.raw) .toc-mobile-links {
    padding: 0 14px 14px;
    display: grid;
    gap: 4px;
  }
  .post-layout:not(.raw) .toc-mobile-links a {
    font-size: 13px;
    color: var(--fg-soft);
    padding: 5px 9px;
    border-radius: 6px;
  }
  .post-layout:not(.raw) .toc-mobile-links a.lv3 { padding-left: 23px; }
  .post-layout:not(.raw) .toc-mobile-links a:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }
}
/* 手机横向留白只保留阅读需要的安全边距。 */
@media (max-width: 640px) {
  .post-layout:not(.raw) {
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
}

async function getLocalText(url, timeout=10000, cache="no-store"){
  const ctl = new AbortController();

    // 内容不变时走 HTTP 缓存，回访不必把整篇文章重新下载一遍。
    const r = await fetch(url, {signal:ctl.signal, cache});
    if(!r.ok) throw new Error("HTTP_"+r.status);
    return await r.text();
  } finally { clearTimeout(timer); }
}
async function pool(items, limit, fn){
  let next = 0;

    while(next < items.length){

      try{ await fn(items[n],n); }catch(e){ console.warn("文章载入失败",e); }
    }
  }));
}

function localRepoUrl(path){

async function fetchList(){

  const url = localRepoUrl(cfg.blogDir.replace(/^\/+|\/+$/g, "") + "/index.json") + "?v=" + Date.now();
  const j = JSON.parse(await getLocalText(url,10000));

  if(!j || !Array.isArray(j.files)) throw new Error("INVALID_INDEX");

/* ---------- 相对路径解析：以 blog/ 为根目录 ---------- */
function relToRepoPath(rel){
  rel = String(rel).trim().split(/[?#]/)[0];
  if(!rel || /^(https?:)?\/\//i.test(rel) || /^(data|blob|mailto|tel|javascript|file):/i.test(rel)) return null;
  const base = String(cfg.blogDir || "blog").replace(/^\/+|\/+$/g, "");
  const parts = ((base ? base + "/" : "") + rel).split("/");
  const st = [];
  for(const seg of parts){
    if(seg === "" || seg === ".") continue;
    if(seg === ".."){ if(st.length > 1) st.pop(); }
    else st.push(seg);
  }
  const clean = st.join("/");
  return (!clean || clean === base) ? null : clean;
}
function assetURLs(repoPath){
  return [localRepoUrl(repoPath)];
}

/* 把整篇 HTML 文档里的相对路径资源改写成仓库绝对地址，并收集备用镜像 */
function rewriteDocAssets(html){
  const alt = {};
  const doc = new DOMParser().parseFromString(String(html), "text/html");
  const mapUrl = v => {
    v = String(v == null ? "" : v).trim();
    if(!v) return v;
    const rp = relToRepoPath(v);
    if(!rp) return v;
    const urls = assetURLs(rp);
    alt[urls[0]] = urls;
    return urls[0];
  };
  const fixAttr = (el, attr) => {
    if(!el.hasAttribute(attr)) return;
    const v = el.getAttribute(attr);
    if(!v || !v.trim()) return;
    const nv = mapUrl(v);
    if(nv !== v.trim()) el.setAttribute(attr, nv);
  };
  doc.querySelectorAll("[src],[href],[poster],[data-src]").forEach(el => {
    ["src","href","poster","data-src"].forEach(a => fixAttr(el, a));
  });
  const fixCss = css => String(css).replace(/url\(\s*(['"]?)([^)'"]+)\1\s*\)/g, (m, q, u) => {
    const nv = mapUrl(u.trim());
    return nv === u.trim() ? m : "url(" + q + nv + q + ")";
  });
  doc.querySelectorAll("[style]").forEach(el => el.setAttribute("style", fixCss(el.getAttribute("style"))));
  doc.querySelectorAll("style").forEach(s2 => { s2.textContent = fixCss(s2.textContent); });
  // 外链在新标签打开，避免把 iframe 导航走
  doc.querySelectorAll('a[href^="http"]').forEach(a => { a.setAttribute("target","_blank"); a.setAttribute("rel","noopener"); });
  doc.querySelectorAll("img").forEach(img => { if(!img.hasAttribute("loading")) img.setAttribute("loading","lazy"); });
  return {html:"<!DOCTYPE html>\n" + doc.documentElement.outerHTML, alt};
}


/* ---------- 元信息解析 ---------- */
function parseFrontMatter(raw){
  const fm = {};
  const m = raw.match(/^\uFEFF?\s*---\r?\n([\s\S]*?)\r?\n---(?:\s*(?:\r?\n|$))/);
  if(!m) return {fm, body:raw};
  let listTags = false;
  m[1].split(/\r?\n/).forEach(line => {
    if(listTags && /^\s*-\s+\S/.test(line)){
      fm.tags.push(line.replace(/^\s*-\s+/, "").trim().replace(/^['\"]|['\"]$/g, ""));
      return;
    }
    listTags = false;
    const match = line.match(/^([\w-]+)\s*:\s*(.*)$/);
    if(!match) return;
    const k = match[1].trim().toLowerCase();
    let v = match[2].trim().replace(/^['\"]|['\"]$/g, "");
    if(["tags", "tag"].includes(k)){
      if(!v){ fm.tags = []; listTags = true; }
      else fm.tags = v.replace(/^\[|\]$/g, "").split(/[,，、]/).map(s => s.trim().replace(/^['\"]|['\"]$/g, "")).filter(Boolean);
    } else if(k === "category" || k === "categories") {
      fm.category = v.replace(/^\[|\]$/g, "").split(/[,，、]/)[0].trim();
    } else fm[k] = v;
  });
  return {fm, body: raw.slice(m[0].length)};
}
function stripMarkup(s){
  return String(s)
    .replace(/```[\s\S]*?```/g," ")
    .replace(/`[^`]*`/g," ")
    .replace(/!\[[^\]]*\]\([^)]*\)/g," ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g,"$1")
    .replace(/<[^>]+>/g," ")
    .replace(/^[\s>#\-*|]+/gm," ")
    .replace(/\s+/g," ").trim();
}
/* 文件名 → 可读标题：去掉日期前缀、序号，连字符转空格 */
function prettyName(base){
  let s = String(base).replace(/\.(md|markdown|html?)$/i, "");
  s = s.replace(/^\s*\d{4}[-_.]?\d{2}[-_.]?\d{2}\s*[-_.\s]*/, "");   // 2026-10-26-
  s = s.replace(/^\s*\d{2,4}[-_.]?\d{2}[-_.]?\d{2}\s*[-_.\s]*/, "");
  s = s.replace(/[_.\-]+/g, " ").replace(/\s+/g, " ").trim();
  if(!s) s = String(base).replace(/\.(md|markdown|html?)$/i, "");
  return s.replace(/\b\w/g, c => c.toUpperCase() === c ? c : c);
}
/* 文件名里提取日期：2026-10-26-title.md / 20261026-title.md */
function dateFromName(name){
  const s = String(name);
  let m = s.match(/(?:^|[^\d])(\d{4})[-_.]?(\d{2})[-_.]?(\d{2})(?:[^\d]|$)/);
  if(m) return m[1] + "-" + m[2] + "-" + m[3];
  return "";
}
/* HTML 里抽取 meta / h1 / 首个段落 */
function htmlPick(raw){
  const get = re => { const m = raw.match(re); return m ? stripMarkup(m[1]) : ""; };
  const title =
    get(/<meta[^>]+(?:property|name)=["']og:title["'][^>]+content=["']([^"']+)["']/i) ||
    get(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']og:title["']/i) ||
    get(/<h1[^>]*>([\s\S]*?)<\/h1>/i) ||
    get(/<title[^>]*>([\s\S]*?)<\/title>/i);
  const desc =
    get(/<meta[^>]+(?:name|property)=["'](?:description|og:description)["'][^>]+content=["']([^"']+)["']/i) ||
    get(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:name|property)=["'](?:description|og:description)["']/i);
  // 首个有实质内容的 <p>（跳过只有标签/图片的）
  let p = "";
  (raw.match(/<p[^>]*>[\s\S]*?<\/p>/gi) || []).forEach(tag => {
    if(p) return;
    const inner = tag.replace(/^<p[^>]*>|<\/p>$/gi, "").replace(/<(script|style)[\s\S]*?<\/\1>/gi, "");
    const t = stripMarkup(inner);
    if(t.replace(/\s/g, "").length >= 12) p = t;
  });
  return {title, desc, p};
}
/* Markdown 里抽取首个标题 / 首段 */
function mdPick(body){
  const lines = body.replace(/\r\n/g, "\n").split("\n");
  let p = "", hTitle = "", hLine = -1, pLine = -1, inCode = false;
  for(let i = 0; i < lines.length; i++){
    if(/^\s*```/.test(lines[i])){ inCode = !inCode; continue; }
    if(inCode) continue;
    const t = lines[i].trim();
    if(!t) continue;
    const mh = lines[i].match(/^#{1,6}\s+(.+?)\s*#*\s*$/);
    if(mh){ if(!hTitle){ hTitle = mh[1].trim(); hLine = i; } continue; }
    if(pLine < 0 && !/^(>|\||[-*+]\s|\d+[.)]\s|!\[|\[!|<!--|---|\*\*\*)/.test(t)){
      const plain = stripMarkup(t);
      if(plain.replace(/\s/g, "").length >= 12){ p = plain; pLine = i; }
    }
  }
  // 标题出现在正文之后 → 它多半只是正文里的一个小节标题，不当作文章标题
  if(hLine >= 0 && pLine >= 0 && hLine > pLine) hTitle = "";
  return {title: hTitle, p};
}
function parsePost(name, raw, extra){
  extra = extra || {};
  const isHtml = /\.html?$/i.test(name);
  const base = name.replace(/\.(md|markdown|html?)$/i,"");
  let meta = {}, body = raw;

  let rawHtml = "";

  if(isHtml){
    const c = raw.match(/<!--([\s\S]*?)-->/);
    if(c && /(?:^|\|)\s*(?:title|date|created|updated|summary|tags|tag|category|categories|cover|draft)\s*:/i.test(c[1])){
      c[1].split("|").forEach(seg => {
        const i = seg.indexOf(":");
        if(i < 0) return;
        const k = seg.slice(0,i).trim().toLowerCase();
        let v = seg.slice(i+1).trim();
        if(k === "tags" || k === "tag"){
          meta.tags = v.replace(/^\[|\]$/g,"").split(/[,，、]/).map(s => s.trim()).filter(Boolean);
        } else if(k === "category" || k === "categories") meta.category = v;
        else meta[k] = v;
      });
      body = raw.replace(c[0], "");
    }
    rawHtml = body;                       // 保留原始文档（「独立页面打开」仍用源文件）
    const pick = htmlPick(raw);
    if(!meta.title) meta.title = pick.title || prettyName(base);
    if(!meta.summary) meta.summary = pick.desc || pick.p;
    // iframe 直接加载源文件，作者自带的 <style> / CSS 外链 / 脚本都在里面原样生效，
    // 这里只需要摘出 <body> 内容用于生成摘要与字数统计。
    const bm = body.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    body = bm ? bm[1] : body.replace(/<\/?(html|head|body|!doctype)[^>]*>/gi, "");
    body = body.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, "").trim();
  } else {
    const r = parseFrontMatter(raw);
    meta = r.fm; body = r.body;
    const pick = mdPick(body);
    if(!meta.title) meta.title = pick.title || prettyName(base);
    if(!meta.summary) meta.summary = pick.p;
  }

  const tags = (Array.isArray(meta.tags) && meta.tags.length ? meta.tags : Array.isArray(extra.tags) ? extra.tags : []).filter(Boolean);
  const declaredTitle = isHtml ? /<!--[\s\S]*?\btitle\s*:/i.test(raw) : !!parseFrontMatter(raw).fm.title;
  const declaredSummary = isHtml ? /<!--[\s\S]*?\bsummary\s*:/i.test(raw) : !!parseFrontMatter(raw).fm.summary;
  if(!declaredTitle && extra.title) meta.title = extra.title;
  if(!declaredSummary && extra.summary) meta.summary = extra.summary;
  /* 日期优先级：手写 frontmatter > 仓库提交记录 > 文件名里的日期 */
  const handCreated = ((meta.date || meta.created || meta.created_at || "") + "").slice(0,10);
  const handUpdated = ((meta.updated || meta.modified || meta.last_modified_at || meta.updated_at || "") + "").slice(0,10);
  const gCreated = (extra.created || "").slice(0,10);
  const gUpdated = (extra.updated || "").slice(0,10);
  const nameDate = dateFromName(name);
  const created = handCreated || gCreated || nameDate || "";
  let updated = handUpdated || gUpdated || "";
  const plain = stripMarkup(body);
  return {
    name, base, isHtml, rawHtml,
    scripts: String(meta.scripts||"").toLowerCase() === "true",
    title: (meta.title || base).trim(),
    category: String(meta.category || extra.category || "未分类").trim() || "未分类",
    created, updated,
    date: created,                                  // 兼容旧字段：列表排序用
    tags,
    autoTitle: !declaredTitle,                       // 无头信息时由正文/索引提取
    autoDate: !handCreated,
    autoSummary: !declaredSummary,
    summary: (meta.summary || plain).slice(0, 140),
    cover: meta.cover || "",
    draft: String(meta.draft||"").toLowerCase() === "true",
    body, plain,
    words: plain.replace(/\s/g,"").length
  };
}

/* ---------- Markdown 渲染（marked 优先，内置解析器兜底） ---------- */
function loadScript(src, timeout=6000){
  return new Promise(res => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    let done = false;
    const finish = v => { if(!done){ done = true; res(v); } };
    s.onload = () => finish(true);
    s.onerror = () => finish(false);
    setTimeout(() => finish(false), timeout);
    document.head.appendChild(s);
  });
}
/* 依次尝试若干来源，取第一个加载成功的。本地 vendor 命中时通常 <100ms。 */
async function loadFirst(srcs, timeout){
  for(const src of srcs){
    if(await loadScript(src, timeout)) return src;
  }
  return null;
}
/* 渲染器来源：本地 vendor 优先，jsDelivr 仅作兜底。
   原实现每页都等两个境外 CDN 脚本（最坏 6s 超时），期间文章只能用内置的
   降级 Markdown 解析器渲染、脚本到位后再整页重绘一次 —— 国内网络下这段
   “降级 → 重绘”的抖动几乎是常态。本地化后渲染链路不再依赖境外网络。 */
const VENDOR_SRC = {
  marked: "./assets/vendor/marked.min.js",
  hljs:   "./assets/vendor/highlight.min.js"
};
const CDN_SRC = {
  marked: "https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js",
  hljs:   "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"
};
/* 代码高亮是增强项而非渲染前提：122KB 的 highlight.js 不该挤占首屏带宽。
   先只取 marked 保证文章能渲染，高亮留到浏览器空闲时再补。 */
function loadHLJSWhenIdle(){
  const run = async () => {
    const b = await loadFirst([VENDOR_SRC.hljs, CDN_SRC.hljs], 6000);
    if(!(b && window.hljs)) return;
    renderers.hljs = true;
    // 补高亮当前已经渲染出来的代码块（首屏那次渲染时它可能还没到位）
    document.querySelectorAll("#mdBody pre code, .md pre code").forEach(code => {
      try{ window.hljs.highlightElement(code); }catch(e){}
    });
  };
  if(typeof requestIdleCallback === "function") requestIdleCallback(() => run(), {timeout:3000});
  else setTimeout(run, 1200);
}
async function ensureRenderers(){
  const a = await loadFirst([VENDOR_SRC.marked, CDN_SRC.marked], 4000);
  if(a && window.marked){ window.marked.setOptions({gfm:true, breaks:false}); }
  renderers.marked = !!(a && window.marked);
  loadHLJSWhenIdle();
  return renderers;   // 同一对象引用：高亮就绪后 .hljs 会自动变为 true
}
function mdFallback(src){
  const blocks = [];
  let s = src.replace(/\r\n/g,"\n");
  s = s.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (m,lang,code) => {
    blocks.push('<pre><code class="language-' + esc(lang||"") + '">' + esc(code.replace(/\n$/,"")) + '</code></pre>');
    return "\u0000B" + (blocks.length-1) + "\u0000";
  });
  s = esc(s);
  const inline = t => t
    .replace(/`([^`]+)`/g, (m,c) => '<code>' + c + '</code>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,a,u) => '<img src="' + u + '" alt="' + a + '">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,a,u) => '<a href="' + u + '" target="_blank" rel="noopener">' + a + '</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");

  const out = [], lines = s.split("\n");
  let i = 0, listType = null;
  const closeList = () => { if(listType){ out.push("</" + listType + ">"); listType = null; } };
  while(i < lines.length){
    const line = lines[i];
    if(/^\u0000B\d+\u0000$/.test(line.trim())){ closeList(); out.push(line.trim()); i++; continue; }
    if(!line.trim()){ closeList(); i++; continue; }
    let m;
    if(m = line.match(/^(#{1,6})\s+(.*)$/)){
      closeList(); const lv = m[1].length;
      out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">"); i++; continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())){ closeList(); out.push("<hr>"); i++; continue; }
    if(/^\s*&gt;/.test(line)){
      closeList(); const q = [];
      while(i < lines.length && /^\s*&gt;/.test(lines[i])){ q.push(lines[i].replace(/^\s*&gt;\s?/,"")); i++; }
      out.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>"); continue;
    }
    if(/^\s*\|.*\|/.test(line) && i+1 < lines.length && /^\s*\|[\s:|-]+\|/.test(lines[i+1])){
      closeList();
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c => c.trim());
      const head = cells(lines[i]); i += 2; const rows = [];
      while(i < lines.length && /\|/.test(lines[i]) && lines[i].trim()){ rows.push(cells(lines[i])); i++; }
      out.push("<table><thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    if(m = line.match(/^\s*[-*+]\s+(.*)$/)){
      if(listType !== "ul"){ closeList(); out.push("<ul>"); listType = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>"); i++; continue;
    }
    if(m = line.match(/^\s*\d+[.)]\s+(.*)$/)){
      if(listType !== "ol"){ closeList(); out.push("<ol>"); listType = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>"); i++; continue;
    }
    closeList();
    const p = [];
    while(i < lines.length && lines[i].trim() && !/^(#{1,6}\s|[-*+]\s|\d+[.)]\s|\s*>|\||\u0000B)/.test(lines[i])){
      p.push(lines[i]); i++;
    }
    if(p.length) out.push("<p>" + inline(p.join("\n")).replace(/\n/g,"<br>") + "</p>");
    else { out.push("<p>" + inline(line) + "</p>"); i++; }
  }
  closeList();
  return out.join("\n").replace(/\u0000B(\d+)\u0000/g, (m,n) => blocks[+n]);
}
function renderBody(p, r){
  if(p.isHtml) return p.body;
  try{
    if(r.marked) return window.marked.parse(p.body);
  }catch(e){}
  return mdFallback(p.body);
}

        cover:p.cover,category:p.category,draft:p.draft,isHtml:p.isHtml,words:p.words,

function hydrate(c){

async function refresh(force=false){
  const seq = ++syncSequence;
  state.refreshing = true;
  if(!state.hasList) state.loading = true;
  render();
  let got;
  try { got = await fetchList(); }
  catch(e){
    if(seq !== syncSequence) return;
    state.refreshing = false;
    state.loading = false;
    state.offline = true;
    // 错误只描述「站点索引」；不再错误地归因于 GitHub API 频率限制。
    state.error = state.hasList ? "" : "INDEX_UNAVAILABLE";
    render();
    return;
  }
  if(seq !== syncSequence) return;
  const old = new Map(state.posts.map(p => [p.name,p]));
  const out = [];
  for(const f of got.files){
    const m = f.meta || {};
    const prev = old.get(f.name);
    if(!force && prev && prev.sha === f.sha && prev.body !== undefined){
      // 从最新索引更新日期，确保已更改的提交日期能够同步。
      if(m.created) prev.created = m.created;
      if(m.updated) prev.updated = m.updated;
      if(m.category) prev.category = m.category;
      if(m.summary && prev.autoSummary) prev.summary = m.summary;
      prev.date = prev.created;
      out.push(prev);
    }else{
      out.push({name:f.name,path:f.path,sha:f.sha,_need:true,_meta:m});
    }
  }
  // 一旦新索引返回零文章，就丢弃旧缓存，不允许被删除的文章复活。
  if(!out.length){
    state.posts=[];
    state.hasList=true;
    state.generated=got.generated;
    state.loading=false;
    state.refreshing=false;
    state.offline=false;
    state.error="";
    state.syncedAt=Date.now();
    writeCache(); render(); return;
  }
  let failed=0;
  await pool(out.filter(p=>p._need),4,async p=>{
    try{
      // URL 带 sha：文章一改 URL 就变，旧缓存自然失效，因此可以安全复用。
      const raw=await getLocalText(localRepoUrl(p.path)+"?v="+encodeURIComponent(p.sha||Date.now()),10000,"default");
      Object.assign(p,parsePost(p.name,raw,p._meta));
      delete p._need;
    }catch(e){
      failed++;
      const prev=old.get(p.name);
      if(prev){
        Object.assign(p,prev);
        delete p._need;
      }else p._dead=true;
    }
  });
  if(seq !== syncSequence) return;
  state.posts=out.filter(p=>!p._dead&&!p.draft&&p.body!==undefined)
    .sort((a,b)=>(b.created||"").localeCompare(a.created||"")||b.name.localeCompare(a.name));
  state.hasList=true;
  state.generated=got.generated;
  state.loading=false;
  state.refreshing=false;
  state.offline=false;
  state.error=failed ? failed + " 篇文章正文暂时无法加载，其他文章可以正常阅读。" : "";
  state.syncedAt=Date.now();
  writeCache(); render();
}

/* ---------- GitHub 项目：仅本人创建的仓库，fork 一律排除 ---------- */
function projectCfg(){
  const p = cfg.projects || {};
  return {
    enabled: p.enabled !== false,
    featured: Array.isArray(p.featured) ? p.featured : (Array.isArray(cfg.featuredProjects) ? cfg.featuredProjects : []),
    count: Math.max(1, Math.min(6, Number(p.featuredCount || cfg.featuredCount || 3))),
    exclude: Array.isArray(p.exclude) ? p.exclude : [],
    source: String(p.source || "projects.json"),
    // 快照被视为「新鲜」的时长：超过就去 GitHub 重新取，保证改名、改描述后能跟上
    refreshMinutes: Math.max(1, Math.min(1440, Number(p.refreshMinutes || cfg.projectsRefreshMinutes || 60))),
    // 允许浏览器直连 GitHub 公开接口；关掉后只认构建时生成的快照
    live: p.liveRefresh !== false && cfg.projectsLiveRefresh !== false
  };
}
function num(n){
  const v = Number(n || 0);
  return v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k" : String(v);
}
const LANG_COLOR = {"JavaScript":"#f1e05a","TypeScript":"#3178c6","Python":"#3572A5","Go":"#00ADD8","Rust":"#dea584",
  "Java":"#b07219","Kotlin":"#A97BFF","Swift":"#F05138","C":"#555555","C++":"#f34b7d","C#":"#178600","HTML":"#e34c26",
  "CSS":"#563d7c","Vue":"#41b883","Svelte":"#ff3e00","Shell":"#89e051","PHP":"#4F5D95","Ruby":"#701516",
  "Dart":"#00B4AB","Scala":"#c22d40","Jupyter Notebook":"#DA5B0B","Makefile":"#427819","Dockerfile":"#384d54",
  "Astro":"#ff5a03","MDX":"#fcb32c","Objective-C":"#438eff","Elixir":"#6e4a7e","Zig":"#ec915c"};
function langColor(l){ return LANG_COLOR[l] || "#8b93a1"; }
function normalizeRepos(list){
  const ex = new Set(projectCfg().exclude.map(s => String(s).toLowerCase()));
  return (Array.isArray(list) ? list : [])
    // fork 与私有仓库不参与展示：这里展示的是「本人创建」的项目
    .filter(r => r && typeof r === "object" && !r.fork && !r.private && (r.name || r.full_name))
    .filter(r => !ex.has(String(r.name || "").toLowerCase()) && !ex.has(String(r.full_name || "").toLowerCase()))
    .map(r => ({
      name: String(r.name || String(r.full_name || "").split("/").pop()),
      full_name: String(r.full_name || r.name || ""),
      html_url: r.html_url || "", homepage: r.homepage || "",
      description: r.description || "", language: r.language || "",
      stars: Number(r.stargazers_count || r.stars || 0),
      forks: Number(r.forks_count || 0),
      topics: Array.isArray(r.topics) ? r.topics.slice(0, 3) : [],
      pushed_at: String(r.pushed_at || r.updated_at || "").slice(0, 10),
      archived: !!r.archived, fork: false
    }))
    .sort((a, b) => b.stars - a.stars || b.pushed_at.localeCompare(a.pushed_at));
}
function projectCache(){

/* 直连 GitHub 公开接口取最新仓库列表（改名、改描述、Star 变化都会反映出来） */
async function fetchLiveRepos(){
  const url = "https://api.github.com/users/" + encodeURIComponent(cfg.owner) + "/repos?per_page=100&sort=pushed";
  const j = JSON.parse(await getLocalText(url, 10000));
  return Array.isArray(j) && j.length ? j : [];
}
/* 读取构建产物里的快照，同时带上它的生成时间 */
async function readSnapshot(){
  const pc = projectCfg();
  if(!pc.source) return null;
  try{
    const j = JSON.parse(await getLocalText("./" + pc.source.replace(/^\/+/, "") + "?v=" + Date.now(), 6000));
    if(!j || !Array.isArray(j.repos)) return null;
    return {repos: normalizeRepos(j.repos), ts: Date.parse(String(j.generated || "")) || 0};
  }catch(e){ return null; }
}
/* 数据新鲜度策略：快照够新就直接用；过期或没有快照时直连 GitHub，
   直连失败再退回手上的旧数据 —— 保证「项目改了，页面跟着改」。 */
async function fetchProjects(){
  const pc = projectCfg();
  const snap = await readSnapshot();
  const stale = !snap || !snap.ts || (Date.now() - snap.ts) > pc.refreshMinutes * 60000;
  if(pc.live && (stale || !snap)){
    try{
      const live = await fetchLiveRepos();
      if(live.length) return {repos: normalizeRepos(live), ts: Date.now(), from: "live"};
    }catch(e){
      if(!snap) throw e;   // 没有快照兜底时才算失败
    }
  }
  if(snap) return {repos: snap.repos, ts: snap.ts || Date.now(), from: "snapshot"};
  throw new Error("PROJECTS_UNAVAILABLE");
}
async function loadProjects(force=false){
  const pc = projectCfg();
  if(!pc.enabled){ state.repos = []; state.reposState = "off"; return; }
  if(state.reposState === "loading") return;
  const cached = projectCache();
  const ttl = pc.refreshMinutes * 60000;
  // 本地缓存仍在有效期内：沿用即可，不发多余请求
  if(!force && cached && Date.now() - (cached.ts || 0) < ttl && state.repos.length){
    state.reposState = "ready"; paintProjects(); return;
  }
  state.reposState = "loading";
  state.reposError = "";
  paintProjects();
  try{
    const got = await fetchProjects();
    state.repos = got.repos;
    state.reposState = "ready";
    state.reposSyncedAt = got.ts;
    state.reposFrom = got.from;
    safeStore.set(PROJECT_CACHE_KEY, JSON.stringify({ts:got.ts, repos:got.repos}));
  }catch(e){
    state.reposError = "暂时没能取回仓库列表。";
    // 刷新失败时保留上一次的数据，页面不至于变空
    if(cached && !state.repos.length){ state.repos = cached.repos; state.reposSyncedAt = cached.ts || 0; state.reposFrom = "cache"; }
    state.reposState = state.repos.length ? "ready" : "error";
  }
  paintProjects();
}
window.loadProjects = loadProjects;
function featuredRepos(){
  const pc = projectCfg();

  // 没手动指定时，自动取 Star 最高的几个（列表已在 normalizeRepos 里排好序）
  if(!want.length) return state.repos.slice(0, pc.count);
  const byName = new Map(state.repos.map(r => [String(r.name).toLowerCase(), r]));
  const byFull = new Map(state.repos.map(r => [String(r.full_name).toLowerCase(), r]));
  return want.map(w => {
    const hit = byFull.get(w.toLowerCase()) || byName.get(w.toLowerCase());
    if(hit) return hit;
    // 列表还没加载完或名字写错时，配置里的仓库至少还能被点开
    const full = w.includes("/") ? w : cfg.owner + "/" + w;
    return {name:full.split("/").pop(), full_name:full, html_url:"https://github.com/" + full, homepage:"",
      description:"", language:"", stars:0, forks:0, topics:[], pushed_at:"", archived:false, pending:true};
  }).slice(0, 6);
}

/* ---------- 渲染：首页 ---------- */
function filtered(){
  const q = state.q.trim().toLowerCase();
  return state.posts.filter(p => {
    // 标签与分类合并为「话题」：命中分类或任一标签即算匹配
    if(state.topic && !(p.category === state.topic || p.tags.includes(state.topic))) return false;
    if(!q) return true;
    return (p.title + " " + p.summary + " " + p.plain + " " + p.tags.join(" ") + " " + p.category).toLowerCase().includes(q);
  }).sort((a,b)=>state.sort === "updated"
    ? (b.updated||b.created||"").localeCompare(a.updated||a.created||"") || (b.created||"").localeCompare(a.created||"")
    : (b.created||"").localeCompare(a.created||"") || b.name.localeCompare(a.name));
}
function fmtDate(d){
  if(!d) return "";
  const p = d.split("-");
  return p.length === 3 ? p.join(".") : d;
}
function highlight(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}
/* 只有真正缺失索引时才提示；空文章列表是一种正常状态。 */

  if(state.error){
    return `<div class="banner soft" role="status"><span>${esc(state.error)}</span><button onclick="refresh(true)">重试</button></div>`;

  if(state.offline && state.posts.length){

  return "";
}

/* ---------- 版权声明 ----------
   三层：页脚常驻（全站）+ 文末声明框（每篇）+ 复制时自动追加出处。
   文案、许可协议、是否拦截图片右键都可在 config.json 的 copyright 段里改。 */
function crCfg(){
  const c = Object.assign({}, DEFAULT_CFG.copyright, cfg.copyright || {});
  if(!c.holder) c.holder = cfg.author || cfg.title;
  if(!c.since) c.since = String(new Date().getFullYear());
  return c;
}
function crYears(c){
  const now = new Date().getFullYear();
  const s = parseInt(c.since, 10);
  return (s && s < now && now - s < 100) ? (s + "–" + now) : String(now);
}
function postURL(p){
  return location.origin + location.pathname + "#/p/" + encodeURIComponent(p.name);
}

function copyrightHTML(p){
  const c = crCfg();
  if(c.enabled === false) return "";
  const url = postURL(p);
  return `<section class="cr-box" aria-label="版权声明">
    <div class="cr-head">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 1.6a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8z"/></svg>

    </dl>
    <p class="cr-notice">${esc(c.notice)} 合理引用请保留作者署名与原文链接。</p>
  </section>`;
}
/* 标题下的单行提示：不打断阅读，但一眼可见 */
function copyrightLine(p){
  const c = crCfg();

  return `<div class="cr-line">© ${esc(crYears(c))} ${esc(c.holder)} · 未经许可不得转载</div>`;

/* 自足的轻提示：不依赖页面里其他 toast 实现的定义顺序 */
let crToastTimer;
function crToast(msg){
  let el = document.getElementById("crToast");
  if(!el){
    el = document.createElement("div");
    el.id = "crToast"; el.className = "cr-toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(crToastTimer);
  crToastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2200);
}
/* 复制正文时自动带上出处；短摘引不受影响 */
function initCopyrightGuard(){
  document.addEventListener("copy", e => {
    const c = crCfg();
    if(c.enabled === false || c.copyAppend === false) return;
    const sel = String(window.getSelection() || "").trim();
    if(sel.length < (parseInt(c.copyMinLength, 10) || 40)) return;
    const link = location.href;
    const name = "";
    let tail = "\n\n—— 摘自《" + (document.title.split(" · ")[0] || cfg.title) + "》\n" + link;
    if(c.notice) tail += "\n（" + c.notice + "）";
    try{
      if(e.clipboardData){
        e.clipboardData.setData("text/plain", sel + tail);
        e.preventDefault();
      }
    }catch(err){ /* 浏览器不允许改写剪贴板时静默放行 */ }
  });
  // 可选：屏蔽图片右键另存（默认关闭，避免误伤正常读者）
  document.addEventListener("contextmenu", e => {
    const c = crCfg();
    if(c.enabled === false || !c.blockImages) return;
    const t = e.target;
    if(t && t.tagName === "IMG"){
      e.preventDefault();
      crToast("图片受版权保护，请勿另存或二次分发");
    }
  });
}

  // iframe 高度由脚本按文章真实长度撑开，内部不滚动 —— 整页只有页面这一条滚动条。
  if(p.isHtml){
    const src = "./" + cfg.blogDir + "/" + encodeURI(p.name).replace(/#/g, "%23").replace(/\?/g, "%3F");
    return `<div class="post-layout raw">
      <div class="post-main">
        <a class="back" href="#/">← 回到文章列表</a>
        <div class="raw-head">
          <a class="btn-s" href="${src}" target="_blank" rel="noopener">↗ 独立页面打开</a>
          <button type="button" class="btn-s" id="rawTocBtn" aria-expanded="false" title="显示/隐藏目录">☰ 目录</button>
          <span class="sp"></span>
          <span class="lb">原样渲染 HTML</span>
        </div>
        <div class="raw-title"><h1>${esc(p.title)}</h1>${metaLine}${copyrightLine(p)}</div>
        <iframe id="rawFrame" class="raw-frame" src="${src}" scrolling="no"
          title="${esc(p.title)}" loading="eager" referrerpolicy="no-referrer"></iframe>
        <p class="raw-tip">这页按作者原样渲染。若你的浏览器禁用了同源 iframe，可点上方「独立页面打开」。</p>
        ${copyrightHTML(p)}
        ${relatedHTML(p)}
        ${foot}
      </div>
    </div>
    <aside class="raw-toc" id="rawToc" aria-label="本文目录"></aside>`;
  }

  return `<div class="post-layout">
    <div class="post-main">
      <a class="back" href="#/">← 回到文章列表</a>
      <div class="post-head">
        <h1>${esc(p.title)}</h1>
        ${metaLine}
        ${copyrightLine(p)}
      </div>
      ${p.cover ? `<div class="post-cover"><img src="${esc(resolveMedia(p.cover))}" alt=""></div>` : ""}
      <div class="post-divider"></div>
      <div class="reading-tools" aria-label="阅读工具">
        <div class="reading-label"><span class="reading-dot" aria-hidden="true"></span> 沉浸阅读</div>
        <div class="reading-actions"><span class="reading-help">字号</span>
          <button data-font="-1" aria-label="缩小正文字号" title="缩小正文字号">A−</button>
          <button data-font="1" aria-label="放大正文字号" title="放大正文字号">A+</button>
          <span class="reading-separator"></span>
          <button data-share="true" aria-label="复制文章链接" title="复制文章链接">↗ 分享文章</button>
        </div>
      </div>
      <details class="toc-mobile" id="tocMobile"><summary>本文目录</summary><div class="toc-mobile-links"></div></details>
      <div class="md" id="mdBody">${renderBody(p, r)}</div>
      ${copyrightHTML(p)}
      ${relatedHTML(p)}
      ${foot}
    </div>
    <aside class="toc" id="toc"></aside>
  </div>`;
}

/* 文件名模糊匹配：链接里的名字和仓库里的名字不完全一致时也能打开 */
function normName(s){
  return String(s || "").replace(/\.(md|markdown|html?)$/i, "")
    .replace(/[\s._\-·•、,，:：/\\()（）\[\]【】!！?？~+'"“”‘’*#&%]/g, "").toLowerCase();
}
function findPost(name){
  const exact = state.posts.find(x => x.name === name);
  if(exact) return exact;
  const n = normName(name);
  if(!n || !state.posts.length) return null;
  const pool = state.posts.map(x => ({p:x, m:normName(x.name)}));
  const same = pool.filter(o => o.m === n);
  if(same.length === 1) return same[0].p;
  const near = pool.filter(o => o.m && (o.m.startsWith(n) || n.startsWith(o.m)));
  if(near.length === 1) return near[0].p;
  if(near.length > 1){
    const best = near.sort((a,b) => Math.abs(b.m.length - n.length) - Math.abs(a.m.length - n.length))[0];
    return best.p;
  }
  return null;
}
function suggestHTML(name){
  const n = normName(name);
  const scored = state.posts.map(p => {
    const m = normName(p.name);
    let s = 0;
    for(let i = 0; i < Math.min(m.length, n.length); i++){ if(m[i] === n[i]) s++; else break; }
    if(m && n && (m.includes(n) || n.includes(m))) s += 10;
    return {p, s};
  }).filter(o => o.s > 2).sort((a,b) => b.s - a.s).slice(0, 5);
  if(!scored.length) return "";
  return `<div style="margin-top:20px;font-size:13px;color:var(--fg-soft)">你可能要找的是</div>
    <div style="margin-top:10px;display:grid;gap:8px;justify-content:center">` +
    scored.map(o => `<a class="chip" style="display:block" href="#/p/${encodeURIComponent(o.p.name)}">${esc(o.p.title)}</a>`).join("") +
    `</div>`;
}

/* ---------- 路由与渲染 ---------- */
let renderers = {marked:false, hljs:false};
function render(){
  const h = location.hash.replace(/^#/, "");
  const app = $("#app");
  if(h.startsWith("/p/")){
    const name = decodeURIComponent(h.slice(3));
    const p = findPost(name);
    if(!p){
      if(state.loading){
        app.innerHTML = `<div class="wrap"><div class="skel" style="margin-top:40px"><i style="width:40%"></i></div></div>`;
      } else {
        app.innerHTML = `<div class="wrap"><div class="empty"><div class="big">404</div><div>这一页风吹走了</div>
          <div style="margin-top:6px;font-size:13px;opacity:.75">${esc(name)}</div>
          ${suggestHTML(name)}
          <div style="margin-top:18px"><a class="chip" href="#/">返回首页</a></div></div></div>`;
      }
      return;
    }
    clearInjected();
    app.innerHTML = postHTML(p, renderers);
    document.title = p.title + " · " + cfg.title;
    const md=document.querySelector('meta[name="description"]'); if(md)md.content=p.summary||cfg.description;
    const og=document.querySelector('meta[property="og:title"]'); if(og)og.content=p.title+" · "+cfg.title;
    const ogd=document.querySelector('meta[property="og:description"]'); if(ogd)ogd.content=p.summary||cfg.description;
    updateActiveNav("");
    afterPost(p);
  } else {
    state.topic="";
    let section="home";
    if(h.startsWith("/topic/")) state.topic=decodeURIComponent(h.slice(7));
    else if(h.startsWith("/tag/")) state.topic=decodeURIComponent(h.slice(5));       // 旧「标签」链接兼容
    else if(h.startsWith("/category/")) state.topic=decodeURIComponent(h.slice(10)); // 旧「分类」链接兼容
    if(h==="/archive")section="archive";
    else if(h==="/topics")section="topics";
    else if(h==="/projects")section="projects";
    else if(h==="/about")section="about";
    else if(h==="/tags" || h==="/categories"){
      // 标签页与分类页已合并为话题页，老链接自动落到新页面
      try{ history.replaceState(null, "", "#/topics"); }catch(e){}
      section="topics";
    }
    app.innerHTML= section==="archive"?archiveHTML():section==="topics"?topicsHTML():section==="projects"?projectsHTML():section==="about"?aboutHTML():homeHTML();
    document.title=(section==="home"?cfg.title:{archive:"归档",topics:"话题",projects:"项目",about:"关于"}[section]+" · "+cfg.title);
    const md=document.querySelector('meta[name="description"]'); if(md)md.content=cfg.description;
    const og=document.querySelector('meta[property="og:title"]'); if(og)og.content=document.title;
    const ogd=document.querySelector('meta[property="og:description"]'); if(ogd)ogd.content=cfg.description;
    $("#q").value=state.q;
    $("#searchWrap").classList.toggle("has",!!state.q);
    updateActiveNav(section);
    // 只在首次进入时自动拉取；失败后由「重试」按钮触发，避免无限重试
    if(section==="projects" && state.reposState === "idle") loadProjects();
  }
}
function setTopic(t){
  state.topic = t || "";
  location.hash = t ? "#/topic/" + encodeURIComponent(t) : "#/";
  if(!t) render();
}
window.setTopic = setTopic;
window.setTag = setTopic; // 兼容旧链接里可能的调用
window.refresh = refresh;

/* 注入作者自带样式（带作用域） */
let styleSeq = 0;
function injectStyle(css){
  if(!css || !css.trim()) return;
  const s = document.createElement("style");
  s.id = "raw-style-" + (++styleSeq);
  s.textContent = css;
  document.head.appendChild(s);
}
function clearInjected(){
  document.querySelectorAll("style[id^=raw-style-]").forEach(s => s.remove());
  stopRawWatch();
}
/* 解析单个媒体地址：相对路径 → 仓库绝对地址 */
function resolveMedia(url){
  if(!url) return "";
  const rp = relToRepoPath(url);
  return rp ? assetURLs(rp)[0] : url;
}
/* 把正文里所有相对路径资源改写到 blog/ 为根的仓库地址 */
function rewriteAssets(root){
  root.querySelectorAll("[src],[href],[poster],[data-src]").forEach(el => {
    ["src","href","poster","data-src"].forEach(attr => {
      if(!el.hasAttribute(attr)) return;
      const v = el.getAttribute(attr);
      const rp = relToRepoPath(v);
      if(!rp) return;
      const urls = assetURLs(rp);
      // 指向另一篇文章的相对链接 → 转成站内路由
      if(el.tagName === "A" && /\.(md|markdown|html?)$/i.test(rp)){
        const fname = rp.split("/").pop();
        const target = state.posts.find(x => x.name === fname);
        if(target){ el.setAttribute(attr, "#/p/" + encodeURIComponent(target.name)); return; }
      }
      el.setAttribute(attr, urls[0]);
      if(el.tagName === "IMG" || el.tagName === "SOURCE"){
        let k = 0;
        el.onerror = () => { k++; if(k < urls.length) el.setAttribute(attr, urls[k]); };
      }
    });
  });
}

/* ---------- 原样 HTML：iframe 渲染 ----------
   作者自带的 CSS / JS 在 iframe 里 100% 生效，同时不污染整站主题。
   两件事必须做到：iframe 高度 = 文章真实长度；iframe 内部不出滚动条。 */

let rawObservers = [];
function stopRawWatch(){
  rawObservers.forEach(fn => { try{ fn(); }catch(e){} });
  rawObservers = [];
}
/* 让 iframe 内部不滚动、高度由内容决定（否则高度永远等于视口，文章被裁） */
function injectFrameStyle(d){
  if(d.getElementById("khtao-frame-fit")) return;
  const s = d.createElement("style");
  s.id = "khtao-frame-fit";
  s.textContent =
    "html,body{overflow:hidden!important;height:auto!important;min-height:0!important;" +
    "max-height:none!important;scrollbar-width:none;}" +
    "html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0}";
  (d.head || d.documentElement).appendChild(s);
}
/* iframe 里 1vh = iframe 自身高度/100。若文章用了 vh，
   「高度跟随内容」和「内容依赖视口」会互相放大 —— 实测会一路涨到浏览器的
   3355 万像素上限。所以先把 vh/dvh/svh/lvh 按外层窗口高度换算成 px 冻结，
   内容高度就不再依赖 iframe 高度，测量一次即可收敛。 */
function freezeViewportUnits(d, base){
  const conv = v => String(v).replace(/(\d*\.?\d+)(vh|dvh|svh|lvh)\b/g,
    (m, n) => (parseFloat(n) * base / 100).toFixed(2) + "px");
  [...(d.styleSheets || [])].forEach(sheet => {
    let rules;
    try{ rules = sheet.cssRules; }catch(e){ return; }   // 跨域样式表读不到，跳过
    if(!rules) return;
    const walk = rs => {
      [...rs].forEach(r => {
        try{
          if(r.style){
            for(let i = 0; i < r.style.length; i++){
              const prop = r.style[i];
              const val = r.style.getPropertyValue(prop);
              if(/\d*\.?\d+(vh|dvh|svh|lvh)\b/.test(val)){
                r.style.setProperty(prop, conv(val), r.style.getPropertyPriority(prop));
              }
            }
          }
          if(r.cssRules) walk(r.cssRules);
        }catch(e){}
      });
    };
    walk(rules);
  });
  d.querySelectorAll("[style]").forEach(el => {
    const s = el.getAttribute("style") || "";
    if(/\d*\.?\d+(vh|dvh|svh|lvh)\b/.test(s)) el.setAttribute("style", conv(s));
  });
}
function frameContentHeight(d){
  const de = d.documentElement, b = d.body;
  let h = 0;
  if(de) h = Math.max(h, de.scrollHeight, de.offsetHeight || 0);
  if(b) h = Math.max(h, b.scrollHeight, b.offsetHeight || 0, Math.ceil(b.getBoundingClientRect().height || 0));
  return h;
}
const FRAME_H_CAP = 120000;   // 安全阀：再长也不让页面被撑到不可理喻
function fitFrame(fr, d){
  const h = frameContentHeight(d);
  if(!h) return;
  const next = Math.min(FRAME_H_CAP, Math.ceil(h));
  const cur = parseInt(fr.style.height, 10) || 0;
  if(Math.abs(next - cur) > 1) fr.style.height = next + "px";
}
/* 高度同步：ResizeObserver + MutationObserver + 图片/字体加载完成，覆盖动态内容 */
function watchFrameHeight(fr, d){
  let raf = 0;
  const tick = () => {
    if(raf) return;
    raf = requestAnimationFrame(() => { raf = 0; fitFrame(fr, d); });
  };
  try{
    if(typeof ResizeObserver === "function"){
      const ro = new ResizeObserver(tick);
      if(d.documentElement) ro.observe(d.documentElement);
      if(d.body) ro.observe(d.body);
      rawObservers.push(() => ro.disconnect());
    }
  }catch(e){}
  try{
    const mo = new MutationObserver(tick);
    mo.observe(d.documentElement, {subtree:true, childList:true, attributes:true});
    rawObservers.push(() => mo.disconnect());
  }catch(e){}
  d.querySelectorAll("img,video,iframe").forEach(el => {
    el.addEventListener("load", tick);
    el.addEventListener("error", tick);
  });
  try{ if(d.fonts && d.fonts.ready) d.fonts.ready.then(tick); }catch(e){}
  const onResize = () => tick();
  window.addEventListener("resize", onResize);
  rawObservers.push(() => window.removeEventListener("resize", onResize));
  [80, 300, 900, 2000].forEach(ms => setTimeout(tick, ms));
  tick();
}
/* 目录：从 iframe 里抓 h1/h2/h3，点击时滚动外层页面到对应位置 */
function buildRawToc(d, fr){
  const panel = document.getElementById("rawToc");
  const btn = document.getElementById("rawTocBtn");
  if(!panel) return;
  const hs = [...d.querySelectorAll("h1,h2,h3")].filter(el => el.textContent.trim());
  if(hs.length < 2){
    if(btn) btn.style.display = "none";
    return;
  }
  panel.innerHTML = '<div class="t">目录<button class="close" id="rawTocClose" aria-label="关闭目录">×</button></div>' +
    hs.map((el, i) => {
      el.setAttribute("data-toc-id", "raw-sec-" + i);
      return `<a href="#/p/" data-toc="raw-sec-${i}" class="${el.tagName === "H3" ? "lv3" : ""}">${esc(el.textContent.trim())}</a>`;
    }).join("");
  const links = [...panel.querySelectorAll("a[data-toc]")];
  /* 标题在 iframe 内：getBoundingClientRect 是相对 iframe 自己的视口，
     要跳转/判高亮必须加上 iframe 在外层文档里的偏移。 */
  const pageTop = el => {
    const frRect = fr.getBoundingClientRect();
    return el.getBoundingClientRect().top + frRect.top;
  };
  panel.querySelectorAll("a[data-toc]").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      const el = d.querySelector('[data-toc-id="' + a.dataset.toc + '"]');
      if(!el) return;
      window.scrollTo({top: Math.max(0, pageTop(el) + window.scrollY - 78), behavior: "smooth"});
    };
  });
  const closeBtn = document.getElementById("rawTocClose");
  if(closeBtn) closeBtn.onclick = () => toggleRawToc(false);
  if(btn){
    btn.style.display = "";   // 之前若因空文档被隐藏过，这里恢复
    btn.onclick = () => toggleRawToc(!panel.classList.contains("on"));
    // 宽屏默认展开，窄屏收起
    toggleRawToc(window.innerWidth >= 1200);
  }
  let ticking = false;
  const onScrollToc = () => {
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      let active = links[0];
      links.forEach(a => {
        const el = d.querySelector('[data-toc-id="' + a.dataset.toc + '"]');
        if(el && pageTop(el) <= 120) active = a;
      });
      links.forEach(a => a.classList.toggle("on", a === active));
    });
  };
  window.addEventListener("scroll", onScrollToc, {passive:true});
  rawObservers.push(() => window.removeEventListener("scroll", onScrollToc));
  onScrollToc();
}
function toggleRawToc(on){
  const panel = document.getElementById("rawToc");
  const btn = document.getElementById("rawTocBtn");
  if(panel) panel.classList.toggle("on", !!on);
  if(btn){
    btn.classList.toggle("on", !!on);
    btn.setAttribute("aria-expanded", on ? "true" : "false");
  }
}
/* iframe 内的链接：外链新窗口，指向其他文章的相对链接转站内路由 */
function fixFrameLinks(d){
  d.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href") || "";
    if(/^https?:/i.test(href)){ a.target = "_blank"; a.rel = "noopener noreferrer"; return; }
    if(/^#/.test(href)) return;
    const fname = href.split("/").pop().split("?")[0].split("#")[0];
    const target = state.posts.find(x => x.name === fname);
    if(target) a.setAttribute("href", "#/p/" + encodeURIComponent(target.name));
  });
}
function initRawFrame(){
  const fr = document.getElementById("rawFrame");
  if(!fr) return;
  let done = false;
  const setup = () => {
    let d = null;
    try{ d = fr.contentDocument; }catch(e){ return; }
    // about:blank 或空文档不算：等真正的 load 事件
    if(!d || !d.body || !d.body.childElementCount) return;
    if(d.location && d.location.href === "about:blank") return;
    if(done) return;
    done = true;
    injectFrameStyle(d);
    freezeViewportUnits(d, window.innerHeight || 900);
    watchFrameHeight(fr, d);
    fixFrameLinks(d);
    fixFrameImages(d);
    buildRawToc(d, fr);
  };
  fr.addEventListener("load", setup);
  // 已经缓存好的 iframe 不会再触发 load，这里直接补一次
  if(fr.contentDocument && fr.contentDocument.readyState === "complete") setup();
  else setTimeout(() => { if(fr.contentDocument && fr.contentDocument.readyState === "complete") setup(); }, 400);
}

/* ---------- 图片体积治理：WebP 升级 + 原生懒加载 ----------
   一篇 50 图的游记原本要在首屏拉取 ~11MB 原图。两件事把首屏降到几百 KB：
   ① 构建期脚本生成 .webp 孪生文件，浏览器支持就换用（不支持/缺失自动回退原图）；
   ② 给每张图补 loading="lazy"，视口外的图不进网络队列。
   iframe 内的原样 HTML 文章走同一套逻辑（见 fixFrameImages）。 */
let WEBP_OK = null;
function webpSupported(){
  if(WEBP_OK !== null) return WEBP_OK;
  try{
    const c = document.createElement("canvas");
    c.width = c.height = 1;
    WEBP_OK = c.toDataURL("image/webp").indexOf("data:image/webp") === 0;
  }catch(e){ WEBP_OK = false; }
  return WEBP_OK;
}
function tuneImage(img, eager){
  if(!img || img.dataset.mediaTuned) return;
  img.dataset.mediaTuned = "1";
  // 首屏几张立刻加载，其余交给浏览器原生的视口判定。
  img.setAttribute("loading", eager ? "eager" : "lazy");
  img.setAttribute("decoding", "async");
  if(eager) img.setAttribute("fetchpriority", "high");
  const src = img.getAttribute("src") || "";
  if(!/\.(jpe?g|png)$/i.test(src) || !webpSupported()) return;
  const webp = src.replace(/\.(jpe?g|png)$/i, ".webp");
  // WebP 缺失（例如本地预览时没跑过优化脚本）就回退到原图，不会裂图。
  img.addEventListener("error", function onerr(){
    img.removeEventListener("error", onerr);
    if(img.getAttribute("src") !== src) img.setAttribute("src", src);
  });
  img.setAttribute("src", webp);
}
/* 文章正文/封面：前 2 张立即加载，其余懒加载 */
function tuneBodyImages(scope, eagerCount){
  if(!scope) return;
  const imgs = scope.querySelectorAll("img");
  imgs.forEach((img, i) => tuneImage(img, i < (eagerCount || 0)));
}
/* 原样 HTML 在 iframe 里渲染，拿不到父页的 body，单独处理一次 */
function fixFrameImages(d){
  if(!d) return;
  try{
    d.querySelectorAll("img").forEach((img, i) => tuneImage(img, i < 2));
  }catch(e){}
}

function afterPost(p){
  const body = $("#mdBody");
  if(p.isHtml){
    stopRawWatch();
    initRawFrame();
    return;
  }
  // ① 相对路径资源（图片/附件/文章互链）统一以 blog/ 为根解析
  rewriteAssets(body);
  // ② 可选：执行文章内脚本（需在元信息里写 scripts: true）
  if(p.scripts){
    body.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }
  // 代码块：高亮 + 复制
  body.querySelectorAll("pre").forEach(pre => {
    const code = pre.querySelector("code") || pre;
    if(renderers.hljs){ try{ window.hljs.highlightElement(code); }catch(e){} }
    const btn = document.createElement("button");
    btn.className = "copy"; btn.textContent = "复制";
    btn.onclick = () => {
      navigator.clipboard.writeText(code.innerText).then(() => {
        btn.textContent = "已复制"; btn.classList.add("done");
        setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("done"); }, 1600);
      });
    };
    pre.appendChild(btn);
  });
  // 外链新窗口
  body.querySelectorAll("a[href^=http]").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  // 图片灯箱（先做体积治理，再绑定交互）
  tuneBodyImages(body, 2);
  body.querySelectorAll("img").forEach(img => {
    img.onclick = () => { const lb = $("#lb"); lb.querySelector("img").src = img.src; lb.classList.add("on"); };
  });
  // 目录（原样 HTML 里标题常从 h1 起，所以一并纳入）
  const toc = $("#toc");
  const hs = body.querySelectorAll(p.isHtml ? "h1,h2,h3" : "h2,h3");
  if(hs.length > 1){
    let html = '<div class="t">目录</div>';
    hs.forEach((el, i) => {
      const id = "sec-" + i; el.id = id;
      html += `<a href="#${id}" data-id="${id}" class="${el.tagName === "H3" ? "lv3" : ""}">${esc(el.textContent)}</a>`;
    });
    toc.innerHTML = html;
    const mobileLinks = $(".toc-mobile-links");
    if(mobileLinks){ mobileLinks.innerHTML = html.replace('<div class="t">目录</div>', ''); }
    const mobileToc = $("#tocMobile");
    if(mobileToc){
      mobileToc.querySelectorAll("a").forEach(a => {
        a.onclick=e=>{
          e.preventDefault();
          const target = document.getElementById(a.dataset.id);
          mobileToc.open=false;
          if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
        };
      });
    }
    toc.querySelectorAll("a").forEach(a => {
      a.onclick = e => {
        e.preventDefault();
        const t = document.getElementById(a.dataset.id);
        window.scrollTo({top: t.getBoundingClientRect().top + window.scrollY - 78, behavior:"smooth"});
      };
    });
    const links = [...toc.querySelectorAll("a")];
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(en.isIntersecting){
          links.forEach(a => a.classList.toggle("on", a.dataset.id === en.target.id));
        }
      });
    }, {rootMargin:"-80px 0px -72% 0px"});
    hs.forEach(el => io.observe(el));
  } else {
    toc.innerHTML = "";
    const mobileToc = $("#tocMobile");
    if(mobileToc) mobileToc.remove();
  }
}

/* ---------- 交互 ---------- */
function onScroll(){
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  $("#bar").style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
  $("#totop").classList.toggle("show", h.scrollTop > 420);
}
let toastTimer;
function showToast(message){
  const el=$("#toast"); if(!el)return;
  el.textContent=message; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("on"),2400);
}
let readingSize=16;
function applyReadingSize(next){
  const source=next===undefined ? (safeStore.get('khtao_reading_size') || readingSize) : next;
  const n=Math.max(14,Math.min(22,Number(source)||16));
  readingSize=n;
  document.documentElement.style.setProperty('--reading-size',n+'px');
  return n;
}
function initUI(){
  applyReadingSize();
  $("#app").addEventListener('click',e=>{
    const clear=e.target.closest('[data-clear]');
    if(clear){
      state.q='';state.topic='';state.visible=6;
      $('#q').value='';$('#searchWrap').classList.remove('has');
      if(location.hash!=='#/')location.hash='#/';else render();return;
    }
    const sort=e.target.closest('[data-sort]');
    if(sort){state.sort=sort.dataset.sort; state.visible=6;render();return;}
    const more=e.target.closest('[data-more]');
    if(more){state.visible+=6;render();return;}
    const lang=e.target.closest('[data-lang]');
    if(lang){state.repoLang=lang.dataset.lang||"";render();return;}
    const projRefresh=e.target.closest('[data-proj-refresh]');
    if(projRefresh){
      projRefresh.disabled=true; projRefresh.textContent="↻ 取回中…";
      loadProjects(true).finally(()=>{ projRefresh.disabled=false; projRefresh.textContent="↻ 刷新"; });
      return;
    }
    const font=e.target.closest('[data-font]');
    if(font){
      const n=Math.max(14,Math.min(22,applyReadingSize()+Number(font.dataset.font)));
      safeStore.set('khtao_reading_size',String(n));applyReadingSize(n);showToast('正文字号 '+n+'px');return;
    }
    if(e.target.closest('[data-share]')){
      const text=window.location.href;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>showToast('文章链接已复制')).catch(()=>showToast('复制失败，请使用浏览器地址栏复制'));
      }else showToast('可从浏览器地址栏复制文章链接');
    }
  });
  const saved = safeStore.get("khtao_theme");
  const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#theme").onclick = () => {
    const now = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = now;
    safeStore.set("khtao_theme", now);
  };

  let timer;
  $("#q").addEventListener("input", e => {
    clearTimeout(timer);
    const v = e.target.value;
    $("#searchWrap").classList.toggle("has", !!v);
    timer = setTimeout(() => {
      state.q = v; state.visible=6;
      if(location.hash.startsWith("#/p/") || location.hash==="#/archive" || location.hash==="#/topics" || location.hash==="#/projects" || location.hash==="#/about"){
        location.hash="#/";
      }else render();
    }, 180);
  });
  $("#clearQ").onclick = () => {
    $("#q").value = ""; state.q = ""; $("#searchWrap").classList.remove("has"); render();
  };
  $("#totop").onclick = () => window.scrollTo({top:0, behavior:"smooth"});
  $("#refresh").classList.add("show");
  $("#refresh").onclick = () => refresh(true);
  $("#lb").onclick = () => $("#lb").classList.remove("on");
  document.addEventListener("keydown", e => {
    const typing=/input|textarea/i.test(document.activeElement?.tagName||"") || document.activeElement?.isContentEditable;
    if(((e.key.toLowerCase()==='k' && (e.ctrlKey||e.metaKey)) || e.key === '/') && !typing){ e.preventDefault(); $("#q").focus(); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k' && typing){e.preventDefault(); $("#q").focus();}
    if(e.key === "Escape") $("#lb").classList.remove("on");
  });
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("hashchange", () => { state.visible=6; window.scrollTo(0,0); render(); onScroll(); });
}

/* ---------- 启动：先渲染缓存（秒开），再静默同步 ---------- */
(async function init(){
  initUI();
  await loadConfig();
  /* 首页精选项目与「项目」页用的仓库列表：与文章索引并行加载，
     排在渲染器 CDN 之前，避免外部脚本变慢时项目数据迟迟不到位。 */
  loadProjects();
  const c = readCache();
  if(c){
    cfg.branch = c.branch || cfg.branch;
    state.posts = hydrate(c);
    state.syncedAt = c.ts;
    state.loading = false;
    state.offline = false;
    state.hasList = true;
    state.generated = c.generated || "";
    render();
  }
  initCopyrightGuard();
  // 首屏索引同步不受外部 Markdown 高亮 CDN 影响。
  const renderersPending = ensureRenderers();
  await refresh(false);
  await renderersPending;   // renderers 是同一引用，高亮就绪后自动生效
  if(location.hash.startsWith("#/p/")) render();
  onScroll();
  /* 每 5 分钟从站点自己的索引同步一次；包括删除最后一篇文章的情况。 */
  setInterval(() => { if(!document.hidden) refresh(false); }, 5 * 60 * 1000);
  startProjectTimer();
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && Date.now() - state.syncedAt > 60000) refresh(false);
    // 从后台切回来时，若项目数据已经过期就顺手更新一次
    if(!document.hidden && projectCfg().enabled && Date.now() - state.reposSyncedAt > projectCfg().refreshMinutes * 60000){
      loadProjects(true);
    }
  });
})();
</script>
