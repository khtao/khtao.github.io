name: Build and deploy blog

# 修复记录（2026-11）：
#   deploy-pages 报 "Found 0 artifact(s) / No artifacts named github-pages" 时，
#   上传步骤其实是绿的。原因是上传端与部署端跨了 artifact 后端代际，且 token
#   缺少 actions: read，部署端列当前 run 的 artifacts 拿到空列表。
#   本次把 Pages 相关 action 统一升到同一代（v5/v6/v7），补齐权限，并加一道
#   上传后自检，让"绿勾但没 artifact"当场变红、不再靠猜。
#   另：旧版 upload-pages-artifact 默认丢弃点文件，会把精心 touch 出来的
#   .nojekyll 悄悄丢掉，这里用 include-hidden-files: true 补回。

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'index.html'
      - 'config.json'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/blog-index.yml'
  # 写成空映射而不是裸键，避免部分 YAML linter 报 empty mapping value。
  workflow_dispatch: {}
  # 定时刷新 projects.json：仓库改名、改描述、Star 变化都会跟上来。
  # 注意：GitHub 不保证 cron 准点，高峰期可能延后；访客端还有一层自动刷新兜底。
  schedule:
    - cron: '17 * * * *'

# Publish the site and its freshly generated manifest in the SAME deployment.
# No GitHub API calls in the visitor browser; no bot commit or race condition.
permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages 需要读取「当前 run 的 artifact 列表」才能定位 github-pages。
  # v5 改用 artifact client 后多数情况不再强制，但显式给上可以排除一类
  # 「权限不足 → 列表为空 → 报 No artifacts named github-pages」的隐性故障，
  # 下面的上传后自检步骤也依赖它。
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A GitHub web upload can replace an existing path before Actions starts.
      # Fail closed so that a changed old URL is never deployed silently.
      - name: Guard against uploaded image overwrites
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/check_image_overwrites.py --base "$BASE_SHA"
      - name: Install image tooling
        # 图片优化依赖 Pillow。ubuntu-24.04 的系统 python3 受 PEP 668 约束，
        # 裸 pip install 会被拒绝，所以依次尝试 pip(--break-system-packages) 与 apt。
        # 都失败也不能让构建红：脚本会自行跳过，按原图发布。
        run: |
          if python3 -c "import PIL" 2>/dev/null; then
            echo "Pillow 已就绪"
          elif python3 -m pip install --quiet --break-system-packages Pillow 2>/dev/null; then
            echo "Pillow 已通过 pip 安装"
          elif sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil 2>/dev/null; then
            echo "Pillow 已通过 apt 安装"
          else
            echo "::warning::Pillow 不可用，本次按原图发布（不影响站点正常访问）"
          fi
      - name: Extract inline base64 images out of articles
        # 必须排在 build_index 之前：它会改写文章源码，之后算出的 sha 才是最终内容的。
        run: python3 scripts/extract_inline_images.py
      - name: Optimize images (WebP twins + recompress)
        run: python3 scripts/optimize_images.py
      - name: Measure image intrinsic sizes (for instant iframe height)
        # 排在 optimize 之后：图片可能被重压缩，尺寸以最终文件为准。
        # 排在 build_index 之前：两者都写进 blog/，一起随产物发布。
        # 没有 Pillow 时输出空清单，站点退化为「加载后收敛」，不阻塞构建。
        run: python3 scripts/image_sizes.py
      - name: Stage offscreen HTML pictures before parsing
        # Prevent iframe from requesting every picture before JS takes control.
        # The page still works as a standalone HTML document.
        run: python3 scripts/prepare_html_lazy.py
      - name: Build index from article files and git history
        run: |
          mkdir -p blog
          python3 scripts/build_index.py
      # 项目页的离线快照：只收录本人创建的仓库，fork 与私有仓库自动排除。
      # 读取失败时脚本静默跳过（不落盘），项目页会回退到浏览器直连 GitHub，
      # 因此这里不能用 --strict，也不能让构建失败。
      - name: Build projects snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_projects.py
      - name: Prepare static website output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html config.json feed.xml sitemap.xml robots.txt _site/
          # Always create .nojekyll: GitHub web uploads may omit hidden files.
          # 光 touch 还不够 —— upload-pages-artifact v4+ 默认排除点文件，
          # 必须配 include-hidden-files: true 才能真正发布出去（见下面上传步骤）。
          touch _site/.nojekyll
          cp -R blog _site/blog
          # 本地化的渲染器（marked / highlight.js）：index.html 靠它们摆脱境外 CDN
          if [ -d assets ]; then cp -R assets _site/assets; fi
          test -f _site/assets/vendor/marked.min.js
          # .optimized.json 只是构建期的去重账本，访客用不到，不必发布
          find _site -name '.optimized.json' -delete
          # projects.json 是可选产物：存在才一起发布，缺失时前端会自行回退。
          if [ -f projects.json ]; then
            cp projects.json _site/projects.json
            python3 -m json.tool _site/projects.json > /dev/null
          else
            echo "::warning::projects.json 未生成，项目页将回退到浏览器直连 GitHub"
          fi
          test -f _site/index.html
          test -f _site/blog/index.json
          test -f _site/blog/search-index.json
          python3 -m json.tool _site/blog/search-index.json > /dev/null
          python3 -m json.tool _site/blog/index.json > /dev/null
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("_site/feed.xml")
          ET.parse("_site/sitemap.xml")
          PYXML
          # 上传前最后一眼：目录非空、大小合理，避免"绿勾 + 空包"。
          echo "---- _site 产物概览 ----"
          find _site -type f | wc -l
          du -sh _site
          test -s _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload website and fresh index in one artifact
        # v5 内部走 upload-artifact@v7，与 deploy-pages@v5 使用同一套 artifact 后端。
        # artifact 名两端都用默认值 github-pages，不显式改名以保证严格对齐。
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true   # 保住 .nojekyll / .well-known 等点文件
      - name: Verify Pages artifact is visible in this run
        # deploy-pages 只会查「当前 run」的 artifacts。上传接口是最终一致的，
        # 所以这里做几次短暂重试：查得到才放行部署，查不到立刻红并给出可操作信息，
        # 不再让失败推迟到 deploy-pages 里变成一句误导性的 githubstatus 提示。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          for i in 1 2 3 4 5 6; do
            names="$(gh api "$url" --jq '.artifacts[]?.name' 2>/dev/null || true)"
            if printf '%s\n' "$names" | grep -qx 'github-pages'; then
              echo "已确认当前 run 的 artifacts："
              printf '%s\n' "$names"
              exit 0
            fi
            echo "第 $i 次检查：github-pages 尚未可见，等待 5s…"
            sleep 5
          done
          echo "::error::上传步骤已结束，但当前 run ($GITHUB_RUN_ID) 里查不到 github-pages artifact。"
          echo "::error::请检查上传步骤日志与 actions: read 权限，不要反复重跑 deploy-pages。"
          exit 1
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
