name: Build and deploy blog

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'index.html'
      - 'config.json'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/blog-index.yml'
  workflow_dispatch:
  # 定时刷新 projects.json：仓库改名、改描述、Star 变化都会跟上来。
  # 注意：GitHub 不保证 cron 准点，高峰期可能延后；访客端还有一层自动刷新兜底。
  schedule:
    - cron: '17 * * * *'

# Publish the site and its freshly generated manifest in the SAME deployment.
# No GitHub API calls in the visitor browser; no bot commit or race condition.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install image tooling
        # 图片优化依赖 Pillow。ubuntu-24.04 的系统 python3 受 PEP 668 约束，
        # 裸 pip install 会被拒绝，所以依次尝试 pip(--break-system-packages) 与 apt。
        # 都失败也不能让构建红：脚本会自行跳过，按原图发布。
        run: |
          if python3 -c "import PIL" 2>/dev/null; then
            echo "Pillow 已就绪"
          elif python3 -m pip install --quiet --break-system-packages Pillow 2>/dev/null; then
            echo "Pillow 已通过 pip 安装"
          elif sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil 2>/dev/null; then
            echo "Pillow 已通过 apt 安装"
          else
            echo "::warning::Pillow 不可用，本次按原图发布（不影响站点正常访问）"
          fi
      - name: Extract inline base64 images out of articles
        # 必须排在 build_index 之前：它会改写文章源码，之后算出的 sha 才是最终内容的。
        run: python3 scripts/extract_inline_images.py
      - name: Optimize images (WebP twins + recompress)
        run: python3 scripts/optimize_images.py
      - name: Measure image intrinsic sizes (for instant iframe height)
        # 排在 optimize 之后：图片可能被重压缩，尺寸以最终文件为准。
        # 排在 build_index 之前：两者都写进 blog/，一起随产物发布。
        # 没有 Pillow 时输出空清单，站点退化为「加载后收敛」，不阻塞构建。
        run: python3 scripts/image_sizes.py
      - name: Build index from article files and git history
        run: |
          mkdir -p blog
          python3 scripts/build_index.py
      # 项目页的离线快照：只收录本人创建的仓库，fork 与私有仓库自动排除。
      # 读取失败时脚本静默跳过（不落盘），项目页会回退到浏览器直连 GitHub，
      # 因此这里不能用 --strict，也不能让构建失败。
      - name: Build projects snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_projects.py
      - name: Prepare static website output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html config.json feed.xml sitemap.xml robots.txt _site/
          # Always create .nojekyll: GitHub web uploads may omit hidden files.
          touch _site/.nojekyll
          cp -R blog _site/blog
          # 本地化的渲染器（marked / highlight.js）：index.html 靠它们摆脱境外 CDN
          if [ -d assets ]; then cp -R assets _site/assets; fi
          test -f _site/assets/vendor/marked.min.js
          # .optimized.json 只是构建期的去重账本，访客用不到，不必发布
          find _site -name '.optimized.json' -delete
          # projects.json 是可选产物：存在才一起发布，缺失时前端会自行回退。
          if [ -f projects.json ]; then
            cp projects.json _site/projects.json
            python3 -m json.tool _site/projects.json > /dev/null
          else
            echo "::warning::projects.json 未生成，项目页将回退到浏览器直连 GitHub"
          fi
          test -f _site/index.html
          test -f _site/blog/index.json
          python3 -m json.tool _site/blog/index.json > /dev/null
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("_site/feed.xml")
          ET.parse("_site/sitemap.xml")
          PYXML
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website and fresh index in one artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
