<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root {
  --bg: #FFF8F0;
  --bg-soft: #FFF1E0;
  --card: #FFFFFF;
  --text: #4A3F35;
  --text-soft: #8B7D6B;
  --text-light: #B8A99A;
  --border: #F0E4D4;

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

}

/* 背景装饰 */
.bg-decor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-decor .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.25; }
.bg-decor .blob1 { width: 400px; height: 400px; background: var(--red); top: -100px; right: -100px; animation: float 8s ease-in-out infinite; }
.bg-decor .blob2 { width: 350px; height: 350px; background: var(--blue); bottom: -80px; left: -80px; animation: float 10s ease-in-out infinite reverse; }
.bg-decor .blob3 { width: 280px; height: 280px; background: var(--yellow); top: 40%; left: 55%; animation: float 12s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,-30px) scale(1.1);} }

.app { position: relative; z-index: 1; min-height: 100vh; }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

/* 顶部导航 */
.topbar {
  display: flex; align-items: center; justify-content: space-between;

}
.topbar .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.topbar .logo-icon {
  width: 38px; height: 38px; border-radius: 12px;
  background: linear-gradient(135deg, var(--red), var(--yellow));
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.topbar .school-name { font-size: 13px; color: var(--text-soft); font-weight: 500; }
.topbar .nav-links { display: flex; gap: 6px; }
.topbar .nav-btn { padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--text-soft); transition: all 0.2s; }
.topbar .nav-btn:hover { background: var(--bg-soft); color: var(--text); }
.topbar .nav-btn.active { background: var(--red); color: white; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 32px; border-radius: 16px; font-size: 16px; font-weight: 600; transition: all 0.25s; white-space: nowrap;
}
.btn-primary { background: linear-gradient(135deg, var(--red), #FF8E53); color: white; box-shadow: 0 6px 20px rgba(255,107,107,0.35); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,107,107,0.45); }
.btn-secondary { background: white; color: var(--text); border: 2px solid var(--border); }

.btn-ghost:hover { color: var(--text); background: var(--bg-soft); }

.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-danger:hover { background: var(--red); color: white; }

/* 首页角色选择 */

}

}

.welcome-card .desc { color: var(--text-soft); font-size: 14px; margin-bottom: 24px; line-height: 1.8; }
.form-group { margin-bottom: 16px; text-align: left; }
.form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.form-group input, .form-group select {

}
.form-group input:focus, .form-group select:focus { border-color: var(--red); background: white; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* 测试页 */
.test-wrap { max-width: 700px; margin: 16px auto; }
.test-header { text-align: center; margin-bottom: 16px; }
.test-progress-bar { width: 100%; height: 10px; background: var(--bg-soft); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
.test-progress-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--yellow)); border-radius: 5px; transition: width 0.4s ease; }

.test-question-card { padding: 28px 24px; margin-bottom: 16px; }
.question-number {

}
.question-text { font-size: 20px; font-weight: 700; line-height: 1.5; margin-bottom: 22px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  display: flex; align-items: flex-start; gap: 14px; padding: 16px 20px;
  border-radius: 16px; border: 2.5px solid var(--border); background: white;
  text-align: left; transition: all 0.25s; width: 100%;
}
.option-btn:hover { border-color: var(--red); background: var(--red-soft); transform: translateX(4px); }
.option-btn.selected { border-color: var(--red); background: var(--red-soft); box-shadow: 0 4px 16px rgba(255,107,107,0.2); }
.option-letter {
  width: 32px; height: 32px; border-radius: 50%; background: var(--bg-soft);
  display: flex; align-items: center; justify-content: center; font-weight: 700;
  font-size: 15px; color: var(--text-soft); flex-shrink: 0; transition: all 0.2s;
}
.option-btn.selected .option-letter { background: var(--red); color: white; }
.option-text { font-size: 15px; line-height: 1.6; padding-top: 4px; }
.test-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }

/* 结果页 */
.result-wrap { max-width: 700px; margin: 16px auto; }
.result-hero {
  text-align: center; padding: 36px 28px; border-radius: var(--radius);
  margin-bottom: 16px; position: relative; overflow: hidden;
}
.result-hero.multi { background: linear-gradient(135deg, var(--red-soft), var(--blue-soft), var(--yellow-soft), var(--green-soft)); }
.result-hero.type-a { background: linear-gradient(135deg, var(--red-soft), #FFD4D4); }
.result-hero.type-b { background: linear-gradient(135deg, var(--green-soft), #D4F5D4); }
.result-hero.type-c { background: linear-gradient(135deg, var(--yellow-soft), #FFF3CC); }
.result-hero.type-d { background: linear-gradient(135deg, var(--blue-soft), #D4ECFF); }
.result-emojis { font-size: 64px; margin-bottom: 12px; }
.result-emojis span { display: inline-block; animation: bounce 2s ease-in-out infinite; }
.result-emojis span:nth-child(2) { animation-delay: 0.3s; }
.result-type-name { font-size: 30px; font-weight: 900; margin-bottom: 6px; }
.result-type-name.type-a { color: var(--red); }
.result-type-name.type-b { color: #2EAF2E; }
.result-type-name.type-c { color: #E6A800; }
.result-type-name.type-d { color: var(--blue); }
.result-type-tag { font-size: 14px; color: var(--text-soft); font-weight: 500; }
.result-section { margin-bottom: 16px; }
.result-section h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.trait-list { display: flex; flex-wrap: wrap; gap: 8px; }
.trait-tag { padding: 6px 16px; border-radius: 18px; font-size: 13px; font-weight: 500; background: var(--bg-soft); color: var(--text); }
.trait-tag.type-a { background: var(--red-soft); color: var(--red); }
.trait-tag.type-b { background: var(--green-soft); color: #2EAF2E; }
.trait-tag.type-c { background: var(--yellow-soft); color: #B8860B; }
.trait-tag.type-d { background: var(--blue-soft); color: var(--blue); }
.advice-box { background: var(--bg); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; }
.advice-box h4 { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.advice-box p { font-size: 13px; line-height: 1.8; color: var(--text); }
.score-bars { display: flex; flex-direction: column; gap: 10px; }
.score-bar-row { display: flex; align-items: center; gap: 10px; }
.score-bar-label { width: 100px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.score-bar-track { flex: 1; height: 22px; background: var(--bg-soft); border-radius: 11px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 11px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 11px; font-weight: 700; color: white; transition: width 0.8s ease; }
.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

/* 教师登录 */
.login-wrap { max-width: 400px; margin: 60px auto; }
.login-card { padding: 36px 28px; text-align: center; }
.login-icon { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px; background: var(--blue-soft); display: flex; align-items: center; justify-content: center; font-size: 36px; }
.login-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.login-card p { font-size: 13px; color: var(--text-soft); margin-bottom: 24px; }
.login-hint { font-size: 12px; color: var(--text-light); margin-top: 14px; }

/* 教师仪表盘 */
.dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.dashboard-header h2 { font-size: 24px; font-weight: 700; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card { background: white; border-radius: var(--radius-sm); padding: 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat-card::after { content: ''; position: absolute; top: -16px; right: -16px; width: 64px; height: 64px; border-radius: 50%; opacity: 0.15; }
.stat-card.total::after { background: var(--text); }
.stat-card.type-a-stat::after { background: var(--red); }
.stat-card.type-b-stat::after { background: var(--green); }
.stat-card.type-c-stat::after { background: var(--yellow); }
.stat-card.type-d-stat::after { background: var(--blue); }
.stat-value { font-size: 32px; font-weight: 900; margin-bottom: 2px; }
.stat-card.total .stat-value { color: var(--text); }
.stat-card.type-a-stat .stat-value { color: var(--red); }
.stat-card.type-b-stat .stat-value { color: #2EAF2E; }
.stat-card.type-c-stat .stat-value { color: #E6A800; }
.stat-card.type-d-stat .stat-value { color: var(--blue); }
.stat-label { font-size: 13px; color: var(--text-soft); font-weight: 500; }
.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
.chart-container { position: relative; width: 100%; height: 300px; }
.chart-container-lg { position: relative; width: 100%; height: 360px; }

/* 筛选工具栏 */
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-box { flex: 1; min-width: 180px; position: relative; }
.search-box input { width: 100%; padding: 10px 16px 10px 38px; border-radius: 12px; border: 2px solid var(--border); font-size: 14px; background: white; outline: none; transition: all 0.2s; }
.search-box input:focus { border-color: var(--blue); }
.search-box::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; }
.filter-select { padding: 10px 14px; border-radius: 12px; border: 2px solid var(--border); font-size: 14px; background: white; outline: none; cursor: pointer; }

/* 学生表格 */
.student-table-wrap { overflow-x: auto; }
.student-table { width: 100%; border-collapse: collapse; }
.student-table th { text-align: left; padding: 12px 14px; font-size: 13px; font-weight: 600; color: var(--text-soft); background: var(--bg-soft); border-bottom: 2px solid var(--border); }
.student-table th:first-child { border-radius: 10px 0 0 10px; }

.student-table tr:hover td { background: var(--bg-soft); }

.student-table .action-btn:hover { background: var(--blue); color: white; }
.student-table .delete-btn { padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: 500; background: var(--red-soft); color: var(--red); margin-left: 6px; transition: all 0.2s; }
.student-table .delete-btn:hover { background: var(--red); color: white; }
.type-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.type-badge.type-a { background: var(--red-soft); color: var(--red); }
.type-badge.type-b { background: var(--green-soft); color: #2EAF2E; }
.type-badge.type-c { background: var(--yellow-soft); color: #B8860B; }
.type-badge.type-d { background: var(--blue-soft); color: var(--blue); }
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 56px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }

/* 学生详情 */
.detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }

.detail-info h2 { font-size: 22px; font-weight: 700; }
.detail-info p { font-size: 13px; color: var(--text-soft); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.answer-review { margin-top: 12px; }
.answer-item { padding: 12px 16px; background: var(--bg); border-radius: 12px; margin-bottom: 8px; }
.answer-item .q { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.answer-item .a { font-size: 12px; color: var(--text-soft); }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--text); color: white; padding: 12px 24px; border-radius: 14px; font-size: 14px; font-weight: 500; z-index: 9999; opacity: 0; transition: all 0.3s; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }

@media (max-width: 768px) {
  .container { padding: 14px 12px; }

<body>
<div class="bg-decor">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>
<div class="app" id="app">
  <div id="topbar-container"></div>
  <div class="container" id="view-container"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
// ==================== 常量配置 ====================
const SCHOOL_NAME = "武汉市光谷第二十六小学";
const TEACHER_PASSWORD = "gg26x";
const CUSTOM_QUESTIONS_KEY = 'gg26x_custom_questions';

// 获取当前使用的题目（优先自定义，否则默认）
function getQuestions() {
  try {
    const custom = JSON.parse(localStorage.getItem(CUSTOM_QUESTIONS_KEY));
    if (custom && Array.isArray(custom) && custom.length > 0) return custom;
  } catch(e) {}
  return QUESTIONS;
}
function saveCustomQuestions(qs) { localStorage.setItem(CUSTOM_QUESTIONS_KEY, JSON.stringify(qs)); }
function resetCustomQuestions() { localStorage.removeItem(CUSTOM_QUESTIONS_KEY); }

// 年级班级配置
const GRADE_CONFIG = {
  "一年级": 5, "二年级": 5, "三年级": 5,
  "四年级": 6, "五年级": 4, "六年级": 5
};
const GRADES = Object.keys(GRADE_CONFIG);

// 8道题目（严格按文档）
const QUESTIONS = [
  { q: "课间休息的时候，你更常做哪件事？", options: [
    { label: "A", text: "主动找新同学聊天，带大家一起玩新游戏", type: "a" },

const STORAGE_KEY = 'gg26x_personality_v2';

// ☁️ 云端同步配置（教师需在此填入自己的QuickForm数据接口地址）
// 配置方法见教师端「数据管理」页面的说明
const QUICKFORM_API = 'https://quickform.cn/api/swt3e6gdza';  // 例如: 'https://quickform.cn/api/abc123xyz'

function isCloudEnabled() { return QUICKFORM_API && QUICKFORM_API.startsWith('http'); }

// 本地数据操作
function loadAllRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}
function saveAllRecords(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// 获取去重后的学生列表（同姓名+年级+班级取最新）
function getUniqueStudents() {
  const all = loadAllRecords();
  const map = {};
  all.forEach(r => {
    const key = r.name + '|' + r.grade + '|' + r.className;
    if (!map[key] || new Date(r.timestamp) > new Date(map[key].timestamp)) {
      map[key] = r;
    }
  });
  return Object.values(map).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}

// 添加学生记录（保留历史，查询时去重）
async function addStudentRecord(student) {
  student.id = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  student.timestamp = new Date().toISOString();
  student.date = new Date().toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  // 先存本地
  const all = loadAllRecords();
  all.push(student);
  saveAllRecords(all);
  // 同步到云端QuickForm
  if (isCloudEnabled()) {
    try {
      await fetch(QUICKFORM_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: student.name,
          grade: student.grade,
          className: student.className,
          answers: student.answers,
          result: student.result,
          resultTypes: student.resultTypes,
          counts: student.counts,
          timestamp: student.timestamp,
          date: student.date,
          localId: student.id
        })
      });
      student.cloudSynced = true;
    } catch(e) {
      student.cloudSynced = false;
      console.warn('云端同步失败:', e);
    }
  }
  return student;
}

// 从云端拉取所有学生记录，合并到本地
async function fetchFromCloud() {
  if (!isCloudEnabled()) return { count: 0, message: '未配置云端' };
  try {
    const res = await fetch(QUICKFORM_API + '/all');
    const data = await res.json();
    // QuickForm返回JSON数组，每个元素就是提交的数据
    const cloudRecords = (Array.isArray(data) ? data : (data.records || data.data || [])).map(r => {
      // 处理answers和counts可能是字符串或对象的情况
      let answers = r.answers, counts = r.counts, resultTypes = r.resultTypes;
      if (typeof answers === 'string') { try { answers = JSON.parse(answers); } catch(e) {} }
      if (typeof counts === 'string') { try { counts = JSON.parse(counts); } catch(e) {} }
      if (typeof resultTypes === 'string') { try { resultTypes = JSON.parse(resultTypes); } catch(e) {} }
      return {
        name: r.name,
        grade: r.grade,
        className: r.className,
        answers: answers || [],
        result: r.result,
        resultTypes: resultTypes || [],
        counts: counts || {},
        timestamp: r.timestamp,
        date: r.date,
        id: r.localId || ('cloud_' + Math.random().toString(36).substr(2,8)),
        cloudSynced: true
      };
    }).filter(r => r.name && r.grade); // 过滤无效记录
    // 合并：以姓名+年级+班级为key，时间戳新的优先
    const local = loadAllRecords();
    const mergedMap = {};
    [...local, ...cloudRecords].forEach(r => {
      const key = r.name + '|' + r.grade + '|' + r.className;
      if (!mergedMap[key] || new Date(r.timestamp) > new Date(mergedMap[key].timestamp)) {
        mergedMap[key] = r;
      }
    });
    saveAllRecords(Object.values(mergedMap));
    return { count: cloudRecords.length, message: `从云端拉取 ${cloudRecords.length} 条记录` };
  } catch(e) {
    console.error('云端拉取失败:', e);
    return { count: 0, message: '云端拉取失败: ' + e.message };
  }
}

}

function calcResult(answers) {
  const counts = { a: 0, b: 0, c: 0, d: 0 };
  answers.forEach(a => { if (counts[a.type] !== undefined) counts[a.type]++; });
  const sorted = Object.entries(counts).sort((x, y) => y[1] - x[1]);
  const maxCount = sorted[0][1];
  const tiedTypes = sorted.filter(([, v]) => v === maxCount && v > 0).map(([k]) => k);
  return { counts, maxType: sorted[0][0], maxCount, tiedCount: tiedTypes.length, tiedTypes };
}

function avatarColor(name) {
  const colors = ['#FF6B6B','#54A0FF','#FECA57','#5CD85C','#A29BFE','#FF9F43','#48DBFB','#FF6B9D'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function getClassOptions(grade) {
  if (!grade || !GRADE_CONFIG[grade]) return [];
  const n = GRADE_CONFIG[grade];
  const arr = [];
  for (let i = 1; i <= n; i++) arr.push(i + '班');
  return arr;
}

function onGradeChange() {
  state.studentGrade = document.getElementById('inputGrade').value;

  classSelect.innerHTML = '<option value="">请选择班级</option>' +
    getClassOptions(state.studentGrade).map(c => `<option value="${c}">${c}</option>`).join('');
}

function startTest() {
  const name = document.getElementById('inputName').value.trim();
  const grade = document.getElementById('inputGrade').value;
  const cls = document.getElementById('inputClass').value;
  if (!name) { showToast('请先输入你的姓名', 'error'); return; }
  if (!grade) { showToast('请先选择年级', 'error'); return; }
  if (!cls) { showToast('请先选择班级', 'error'); return; }
  state.studentName = name;
  state.studentGrade = grade;
  state.studentClass = cls;
  state.currentQuestion = 0;
  state.answers = [];
  navigate('test');
}

// ==================== 测试页 ====================
function renderTest() {
  const q = getQuestions()[state.currentQuestion];
  const progress = (state.currentQuestion / getQuestions().length) * 100;
  const selected = state.answers[state.currentQuestion];
  return `<div class="view active instant">
    <div class="test-wrap">
      <div class="test-header">
        <div class="test-progress-bar"><div class="test-progress-fill" style="width:${progress}%"></div></div>
        <div class="test-progress-text">第 ${state.currentQuestion + 1} 题 / 共 ${getQuestions().length} 题</div>
      </div>
      <div class="card test-question-card">
        <div class="question-number">问题 ${state.currentQuestion + 1}</div>
        <div class="question-text">${q.q}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <button class="option-btn ${selected && selected.label===opt.label ? 'selected' : ''}" onclick="selectOption(${i})">
              <div class="option-letter">${opt.label}</div>
              <div class="option-text">${opt.text}</div>
            </button>
          `).join('')}
        </div>
      </div>
      <div class="test-nav">
        <button class="btn btn-secondary" ${state.currentQuestion===0?'disabled':''} onclick="prevQuestion()">← 上一题</button>
        ${state.currentQuestion < getQuestions().length - 1
          ? `<button class="btn btn-primary" id="nextBtn" ${!selected?'disabled':''} onclick="nextQuestion()">下一题 →</button>`
          : `<button class="btn btn-primary" id="nextBtn" ${!selected?'disabled':''} onclick="finishTest()">查看结果 🎉</button>`
        }
      </div>
    </div>
  </div>`;
}

function selectOption(idx) {
  const q = getQuestions()[state.currentQuestion];
  state.answers[state.currentQuestion] = { ...q.options[idx], questionIdx: state.currentQuestion };
  // 只更新DOM选中状态，不重建整个页面，避免闪烁
  const options = document.querySelectorAll('.option-btn');
  options.forEach(btn => btn.classList.remove('selected'));
  if (options[idx]) options[idx].classList.add('selected');
  // 更新下一题/查看结果按钮的可用状态
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.disabled = false;
}
function prevQuestion() { if (state.currentQuestion > 0) { state.currentQuestion--; render({keepTopbar:true}); } }
function nextQuestion() {
  if (!state.answers[state.currentQuestion]) { showToast('请先选择一个选项', 'error'); return; }
  if (state.currentQuestion < getQuestions().length - 1) { state.currentQuestion++; render({keepTopbar:true}); }
}
async function finishTest() {
  if (!state.answers[state.currentQuestion]) { showToast('请先选择一个选项', 'error'); return; }
  const result = calcResult(state.answers);
  state.result = result;
  showToast('正在提交成绩...', 'success');
  try {
    await addStudentRecord({
      name: state.studentName,
      grade: state.studentGrade,
      className: state.studentClass,
      answers: state.answers.map(a => ({ label: a.label, type: a.type, text: a.text, question: getQuestions()[a.questionIdx].q })),
      result: result.maxType,
      resultTypes: result.tiedTypes,
      counts: result.counts
    });
  } catch(e) { console.warn(e); }
  navigate('result');
}

function exportFilteredData() {
  let students = getUniqueStudents();
  if (state.searchKeyword) {
    const kw = state.searchKeyword.toLowerCase();
    students = students.filter(s => s.name.toLowerCase().includes(kw));
  }
  if (state.filterGrade) students = students.filter(s => s.grade === state.filterGrade);
  if (state.filterClass) students = students.filter(s => s.className === state.filterClass);
  if (state.filterType) students = students.filter(s => s.result === state.filterType);
  exportStudentsToCSV(students, '筛选数据');
}

function exportStudentsToCSV(students, label) {
  if (students.length === 0) { showToast('暂无数据可导出', 'error'); return; }
  const qCount = getQuestions().length;
  // 表头：基本信息 + 每道题的答案 + 统计 + 时间
  let header = '姓名,年级,班级,性格颜色';
  for (let i = 1; i <= qCount; i++) header += `,第${i}题答案`;
  header += ',A选项数,B选项数,C选项数,D选项数,测试时间\n';
  let csv = '\uFEFF' + header;
  students.forEach(s => {
    const t = TYPES[s.result];
    let row = `${s.name},${s.grade},${s.className},${t.name}`;
    // 每道题的答案字母
    for (let i = 0; i < qCount; i++) {
      const ans = s.answers && s.answers[i] ? s.answers[i].label : '';
      row += `,${ans}`;
    }
    row += `,${s.counts.a},${s.counts.b},${s.counts.c},${s.counts.d},${s.date}\n`;
    csv += row;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${SCHOOL_NAME}_性格测试_${label}_答题详情_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据导出成功，包含每题答题详情', 'success');
}

function renderAnalysis() {
  const allStudents = getUniqueStudents();
  const gradeOptions = GRADES.map(g => `<option value="${g}" ${state.analysisGrade===g?'selected':''}>${g}</option>`).join('');
  const classOptions = state.analysisGrade
    ? getClassOptions(state.analysisGrade).map(c => `<option value="${c}" ${state.analysisClass===c?'selected':''}>${c}</option>`).join('')
    : '';

  // 按筛选条件过滤
  let filtered = allStudents;
  let scopeText = '全校';
  if (state.analysisGrade) { filtered = filtered.filter(s => s.grade === state.analysisGrade); scopeText = state.analysisGrade; }
  if (state.analysisClass) { filtered = filtered.filter(s => s.className === state.analysisClass); scopeText = state.analysisGrade + state.analysisClass; }

  const counts = { a: 0, b: 0, c: 0, d: 0 };
  filtered.forEach(s => { if (counts[s.result] !== undefined) counts[s.result]++; });

  // 各年级分布数据
  const gradeDist = GRADES.map(g => {
    const gs = allStudents.filter(s => s.grade === g);
    return { grade: g, total: gs.length, a: gs.filter(s=>s.result==='a').length, b: gs.filter(s=>s.result==='b').length, c: gs.filter(s=>s.result==='c').length, d: gs.filter(s=>s.result==='d').length };
  });

  return `<div class="view active">
    <div class="dashboard-header">
      <h2>📈 分析统计</h2>
      <button class="btn btn-primary btn-sm" onclick="exportScopeData()">📥 导出${scopeText}数据</button>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-title">🔍 筛选范围</div>
      <div class="toolbar" style="margin-bottom:0;">
        <select class="filter-select" onchange="state.analysisGrade=this.value;state.analysisClass='';render();">
          <option value="">全校</option>
          ${gradeOptions}
        </select>
        <select class="filter-select" onchange="state.analysisClass=this.value;render();" ${!state.analysisGrade?'disabled':''}>
          <option value="">全年级</option>
          ${classOptions}
        </select>
        <span style="font-size:14px;font-weight:600;color:var(--text);">当前范围：${scopeText}（共 ${filtered.length} 人）</span>
      </div>
    </div>

    ${filtered.length === 0 ? '<div class="card"><div class="empty-state"><div class="empty-icon">📊</div><p>该范围暂无测试数据</p></div></div>' :
    `<div class="dashboard-grid">
      <div class="card">
        <div class="card-title" style="justify-content:space-between;">🥧 ${scopeText}性格颜色分布 <button class="btn btn-ghost btn-sm" onclick="downloadChart('chartScopePie','${scopeText}性格颜色分布.png')">📥 下载图表</button></div>
        <div class="chart-container" id="chartScopePie"></div>

        <div class="card-title" style="justify-content:space-between;">📊 ${scopeText}各类型人数 <button class="btn btn-ghost btn-sm" onclick="downloadChart('chartScopeBar','${scopeText}各类型人数.png')">📥 下载图表</button></div>
        <div class="chart-container" id="chartScopeBar"></div>
      </div>
    </div>
    <div class="card" style="margin-top:18px;">
      <div class="card-title" style="justify-content:space-between;">🏫 全校各年级性格颜色对比 <button class="btn btn-ghost btn-sm" onclick="downloadChart('chartGradeCompare','全校各年级性格颜色对比.png')">📥 下载图表</button></div>

function exportScopeData() {

// ==================== 图表下载 ====================
function downloadChart(containerId, filename) {
  const el = document.getElementById(containerId);
  if (!el) { showToast('图表未找到', 'error'); return; }
  const chart = echarts.getInstanceByDom(el);
  if (!chart) { showToast('图表未初始化', 'error'); return; }
  const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#fff' });
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || 'chart.png';
  a.click();
  showToast('图表已下载', 'success');
}

function addQuestion() {
  editingQuestions.push({
    q: "新题目，请在此输入题目内容",
    options: [
      { label: "A", text: "选项A内容", type: "a" },
      { label: "B", text: "选项B内容", type: "b" },
      { label: "C", text: "选项C内容", type: "c" },
      { label: "D", text: "选项D内容", type: "d" }
    ]
  });
  render();
}

function removeQuestion(idx) {
  if (editingQuestions.length <= 1) { showToast('至少保留一道题目', 'error'); return; }
  if (confirm('确定删除这道题目吗？')) {
    editingQuestions.splice(idx, 1);
    render();
  }
}

function saveQuestions() {
  // 验证
  for (let i = 0; i < editingQuestions.length; i++) {
    const q = editingQuestions[i];
    if (!q.q.trim()) { showToast(`第${i+1}题题目内容不能为空`, 'error'); return; }
    for (let j = 0; j < q.options.length; j++) {
      if (!q.options[j].text.trim()) { showToast(`第${i+1}题选项${q.options[j].label}不能为空`, 'error'); return; }
    }
  }
  saveCustomQuestions(editingQuestions);
  editingQuestions = null;
  showToast('题目已保存，学生端将使用新题目', 'success');
  render();
}

function resetQuestions() {
  if (confirm('确定恢复为默认题目吗？当前自定义题目将被清除。')) {
    resetCustomQuestions();
    editingQuestions = null;
    showToast('已恢复默认题目', 'success');
    render();
  }
}

function getStorageInfo() {
  let total = 0;
  for (let key in localStorage) {
    if (localStorage.hasOwnProperty(key)) {
      total += localStorage[key].length + key.length;
    }
  }
  return { sizeKB: (total / 1024).toFixed(1) };
}

function backupAllData() {
  const data = {
    version: '1.0',
    exportTime: new Date().toISOString(),
    school: SCHOOL_NAME,
    records: loadAllRecords(),
    customQuestions: localStorage.getItem(CUSTOM_QUESTIONS_KEY)
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${SCHOOL_NAME}_性格测试数据备份_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('完整备份已导出', 'success');
}

function restoreFromFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.records || !Array.isArray(data.records)) {
        showToast('备份文件格式不正确', 'error');
        return;
      }
      if (confirm(`确定要恢复数据吗？\n\n将导入 ${data.records.length} 条测试记录。\n当前数据将被覆盖！`)) {
        saveAllRecords(data.records);
        if (data.customQuestions) {
          localStorage.setItem(CUSTOM_QUESTIONS_KEY, data.customQuestions);
        }
        showToast('数据恢复成功', 'success');
        render();
      }
    } catch(err) {
      showToast('文件解析失败，请确认是有效的备份文件', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function saveAllRecords(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function exportGradeCSV(grade) {
  const students = getUniqueStudents().filter(s => s.grade === grade);
  exportStudentsToCSV(students, grade);
}

function clearAllData() {
  if (confirm('⚠️ 确定要清空所有测试数据吗？\n\n此操作不可恢复！建议先导出备份。')) {
    if (confirm('再次确认：真的要删除所有学生的测试数据吗？')) {
      localStorage.removeItem(STORAGE_KEY);
      showToast('所有数据已清空', 'success');
      render();
    }
  }
}

// ==================== 初始化 ====================
function init() {
  const hash = window.location.hash.replace('#', '');
  if (hash === 'student' || hash === 'studentWelcome') navigate('studentWelcome');
  else if (hash === 'teacher') navigate(isTeacherAuth() ? 'teacher' : 'teacherLogin');
  else navigate('home');
}
window.addEventListener('hashchange', () => {
  const hash = window.location.hash.replace('#', '');
  if (hash === 'student') navigate('studentWelcome');
  else if (hash === 'teacher') navigate(isTeacherAuth() ? 'teacher' : 'teacherLogin');
});
init();
</script>
